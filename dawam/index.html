<script>
(function(){
/* ===== إعدادات Firebase (نفس مشروع السكرتارية، بمجموعات منفصلة تبدأ بـ dawam_) ===== */
const FIREBASE_CONFIG = {

const PREFIX='dawam_';

const DEF_RULES={present:5,late:2,absent:-10,leave:0};

const ATT=['present','late','absent','leave'];

const TABS=[['day','الدوام اليومي'],['points','النقاط والترتيب'],['log','السجل'],['staff','الموظفون','admin'],['users','المستخدمون','admin'],['rules','لائحة النقاط','admin']];

const S={emps:[],logs:[],users:[],rules:{...DEF_RULES},date:today(),tab:'day',logEmp:'',logMonth:today().slice(0,7),
  me:null,loaded:{emps:false,logs:false,users:false}};
let db;
const col=n=>db.collection(PREFIX+n);

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(ds,n){const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const nf=new Intl.NumberFormat('ar-IQ');
const num=n=>nf.format(n);
const signed=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'0';
const ptsCls=n=>n>0?'p':n<0?'m':'z';
function fmtDate(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function shortDate(ds){if(!ds)return '';const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-IQ',{day:'numeric',month:'short'})}
const empName=id=>(S.emps.find(x=>x.id===id)||{name:'موظف محذوف'}).name;
const activeEmps=()=>S.emps.filter(e=>!e.archived).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const balance=id=>S.logs.reduce((s,l)=>l.emp===id?s+(Number(l.pts)||0):s,0);
const attFor=(id,date)=>S.logs.find(l=>l.id==='att_'+date+'_'+id);
const isAdmin=()=>S.me&&S.me.role==='admin';
const canRecord=()=>S.me&&(S.me.role==='admin'||S.me.role==='recorder');
async function hash(u,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dawam|'+u.toLowerCase()+'|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const stamp=()=>({at:new Date().toISOString(),by:S.me?S.me.id:'',byName:S.me?S.me.name:''});

let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function fail(e){console.error(e);toast(e&&e.code==='permission-denied'?'قاعدة البيانات رفضت الحفظ. راجع قواعد Firestore لمجموعات dawam_':'تعذّر الحفظ، تحقق من الاتصال بالإنترنت');}

/* ===== كتابة ===== */
async function setAtt(emp,kind){
  if(!canRecord())return;
  const id='att_'+S.date+'_'+emp;const cur=attFor(emp,S.date);
  try{
    if(cur&&cur.kind===kind) await col('logs').doc(id).delete();
    else await col('logs').doc(id).set({emp,kind,pts:Number(S.rules[kind])||0,date:S.date,note:'',...stamp()});
  }catch(e){fail(e)}
}
async function markAllPresent(){
  const todo=activeEmps().filter(e=>!attFor(e.id,S.date));
  const batch=db.batch();
  todo.forEach(e=>batch.set(col('logs').doc('att_'+S.date+'_'+e.id),{emp:e.id,kind:'present',pts:Number(S.rules.present)||0,date:S.date,note:'',...stamp()}));
  try{await batch.commit();toast('سُجّل حضور '+num(todo.length)+' موظف')}catch(e){fail(e)}
}

/* ===== نوافذ ===== */
function modal(html,onMount){
  const L=document.getElementById('layer');
  L.innerHTML='<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  const ov=document.getElementById('ov');
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.addEventListener('keydown',escClose);
  onMount&&onMount(ov.firstChild);
  const f=ov.querySelector('input:not([disabled]),select');f&&f.focus();
}
function escClose(e){if(e.key==='Escape')close()}
function close(){document.getElementById('layer').innerHTML='';document.removeEventListener('keydown',escClose)}
function confirmBox(title,text,okLabel,fn){
  modal('<h3>'+esc(title)+'</h3><p class="hint">'+esc(text)+'</p><div class="acts"><button class="btn danger" id="ok">'+esc(okLabel)+'</button><button class="btn" id="cn">تراجع</button></div>',m=>{
    m.querySelector('#cn').onclick=close;
    m.querySelector('#ok').onclick=async()=>{close();await fn()};
  });
}
function pointsModal(empId){
  const emps=activeEmps();let kind='reward';
  modal(`<h3>مكافأة أو عقوبة</h3>
    <div class="toggle"><button data-v="reward" aria-pressed="true">مكافأة (+)</button><button data-v="penalty" aria-pressed="false">عقوبة (−)</button></div>
    <label class="f">الموظف<select id="pe">${emps.map(e=>`<option value="${esc(e.id)}" ${e.id===empId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>
    <div class="form"><label class="f">عدد النقاط<input id="pn" type="number" min="1" step="1" value="5" inputmode="numeric"></label>
    <label class="f">التاريخ<input id="pd" type="date" value="${S.date}"></label></div>
    <label class="f">السبب<input id="pr" type="text" placeholder="مثال: إنجاز معاملة عاجلة خارج الدوام"></label>
    <p class="err" id="pm"></p>
    <div class="acts"><button class="btn primary" id="ok">تسجيل</button><button class="btn" id="cn">إلغاء</button></div>`,m=>{
    m.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{kind=b.dataset.v;m.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    m.querySelector('#cn').onclick=close;
    m.querySelector('#ok').onclick=async()=>{
      const n=Math.abs(parseInt(m.querySelector('#pn').value,10));const reason=m.querySelector('#pr').value.trim();
      if(!n){m.querySelector('#pm').textContent='اكتب عدد النقاط';return}
      if(!reason){m.querySelector('#pm').textContent='اكتب سبب '+(kind==='reward'?'المكافأة':'العقوبة');return}
      const rec={emp:m.querySelector('#pe').value,kind,pts:kind==='reward'?n:-n,date:m.querySelector('#pd').value||S.date,note:reason,...stamp()};
      close();
      try{await col('logs').add(rec);toast(kind==='reward'?'سُجّلت المكافأة':'سُجّلت العقوبة')}catch(e){fail(e)}
    };

      const open=emp?0:(parseInt(m.querySelector('#eb').value,10)||0);

      try{

        else{
          const ref=await col('employees').add({...data,archived:false,createdAt:new Date().toISOString()});
          if(open)await col('logs').add({emp:ref.id,kind:open>0?'reward':'penalty',pts:open,date:today(),note:'رصيد افتتاحي',...stamp()});
          toast('أُضيف '+name);
        }
      }catch(e){fail(e)}
    };
  });
}
function userModal(u){
  modal(`<h3>${u?'تعديل المستخدم':'إضافة مستخدم'}</h3>
    <label class="f">الاسم الظاهر<input id="un" type="text" value="${esc(u?.name||'')}" placeholder="مثال: علي حسين"></label>
    <label class="f">اسم الدخول<input id="uu" type="text" value="${esc(u?.username||'')}" ${u?'disabled':''} autocomplete="off" dir="ltr" placeholder="ali"></label>
    <label class="f">${u?'كلمة مرور جديدة (اتركها فارغة للإبقاء)':'كلمة المرور'}<input id="up" type="password" autocomplete="new-password"></label>
    <label class="f">الصلاحية<select id="ur" ${u&&u.id===S.me.id?'disabled':''}>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${(u?.role||'recorder')===k?'selected':''}>${v.l}</option>`).join('')}</select></label>
    <p class="hint" id="rd"></p>
    <p class="err" id="um"></p>
    <div class="acts"><button class="btn primary" id="ok">${u?'حفظ':'إضافة'}</button><button class="btn" id="cn">إلغاء</button></div>`,m=>{
    const rs=m.querySelector('#ur'),rd=m.querySelector('#rd');const sd=()=>rd.textContent=ROLES[rs.value].d;sd();rs.onchange=sd;
    m.querySelector('#cn').onclick=close;
    m.querySelector('#ok').onclick=async()=>{
      const er=m.querySelector('#um');const name=m.querySelector('#un').value.trim();
      const username=(u?u.username:m.querySelector('#uu').value.trim().toLowerCase());const pass=m.querySelector('#up').value;const role=rs.value;
      if(!name){er.textContent='اكتب الاسم';return}
      if(!u){
        if(!/^[a-z0-9._-]{3,}$/.test(username)){er.textContent='اسم الدخول: 3 أحرف إنجليزية أو أرقام على الأقل';return}
        if(S.users.some(x=>x.username===username)){er.textContent='اسم الدخول مستخدم مسبقاً';return}
      }
      if((!u||pass)&&pass.length<6){er.textContent='كلمة المرور 6 أحرف على الأقل';return}
      if(u&&u.role==='admin'&&role!=='admin'&&S.users.filter(x=>x.role==='admin').length<2){er.textContent='يجب أن يبقى مدير نظام واحد على الأقل';return}
      const data={name,role};if(pass)data.pass=await hash(username,pass);
      close();
      try{
        if(u){await col('users').doc(u.id).update(data);toast('حُفظ المستخدم')}
        else{await col('users').add({...data,username,createdAt:new Date().toISOString()});toast('أُضيف المستخدم '+name)}
      }catch(e){fail(e)}
    };
  });
}

/* ===== شاشات الدخول ===== */
function gateSetup(){
  const g=document.getElementById('gate');g.hidden=false;document.getElementById('shell').hidden=true;
  g.innerHTML=`<form class="card" id="sf"><h1>دفتر الدوام والنقاط</h1><p class="hint">أول تشغيل: أنشئ حساب مدير النظام. بعدها تضيف بقية المستخدمين من داخل التطبيق.</p>
    <label class="f">الاسم الظاهر<input id="sn" type="text" required></label>
    <label class="f">اسم الدخول<input id="su" type="text" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input id="sp" type="password" autocomplete="new-password" required></label>
    <p class="err" id="se"></p><button class="btn primary" type="submit">إنشاء الحساب والدخول</button></form>`;
  document.getElementById('sf').onsubmit=async e=>{
    e.preventDefault();const er=document.getElementById('se');
    const name=document.getElementById('sn').value.trim(),username=document.getElementById('su').value.trim().toLowerCase(),pass=document.getElementById('sp').value;
    if(!/^[a-z0-9._-]{3,}$/.test(username)){er.textContent='اسم الدخول: 3 أحرف إنجليزية أو أرقام على الأقل';return}
    if(pass.length<6){er.textContent='كلمة المرور 6 أحرف على الأقل';return}
    try{const ref=await col('users').add({name,username,role:'admin',pass:await hash(username,pass),createdAt:new Date().toISOString()});login(ref.id)}catch(err){er.textContent='تعذّر الإنشاء: '+(err.code==='permission-denied'?'قواعد Firestore ترفض الكتابة':'تحقق من الاتصال')}
  };
}
function gateLogin(){
  const g=document.getElementById('gate');g.hidden=false;document.getElementById('shell').hidden=true;
  g.innerHTML=`<form class="card" id="lf"><h1>دفتر الدوام والنقاط</h1><p class="hint">سجّل الدخول بحسابك.</p>
    <label class="f">اسم الدخول<input id="lu" type="text" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input id="lp" type="password" autocomplete="current-password" required></label>
    <p class="err" id="le"></p><button class="btn primary" type="submit">دخول</button></form>`;
  document.getElementById('lu').focus();
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;
    const acc=S.users.find(x=>x.username===u);
    if(acc&&acc.pass===await hash(u,p))login(acc.id);else document.getElementById('le').textContent='اسم الدخول أو كلمة المرور غير صحيحة';
  };
}
function login(id){try{localStorage.setItem('dawam_session',id)}catch(_){}S.me=S.users.find(u=>u.id===id)||null;route()}
function logout(){try{localStorage.removeItem('dawam_session')}catch(_){}S.me=null;route()}
function route(){
  if(!S.loaded.users)return;
  if(!S.users.length){gateSetup();return}
  if(!S.me){let sid=null;try{sid=localStorage.getItem('dawam_session')}catch(_){}S.me=S.users.find(u=>u.id===sid)||null}
  else S.me=S.users.find(u=>u.id===S.me.id)||null;
  if(!S.me){gateLogin();return}
  document.getElementById('gate').hidden=true;document.getElementById('shell').hidden=false;
  render();
}

/* ===== العرض ===== */
function roNote(){return canRecord()?'':'<div class="ro-note">حسابك للاطلاع فقط. التسجيل يحتاج صلاحية «مسجّل دوام» من مدير النظام.</div>'}
function noStaff(){return `<div class="list"><div class="empty"><b>لا يوجد موظفون بعد</b>${isAdmin()?'أضف موظفي المكتب ليظهروا هنا.<div style="margin-top:12px"><button class="btn primary" data-act="addemp">إضافة موظف</button></div>':'سيظهرون هنا بعد أن يضيفهم مدير النظام.'}</div></div>`}
function viewDay(){
  const emps=activeEmps();const cnt={present:0,late:0,absent:0,leave:0};let un=0;
  emps.forEach(e=>{const a=attFor(e.id,S.date);a?cnt[a.kind]++:un++});
  const dis=canRecord()?'':'disabled';
  let h=roNote();
  h+=`<div class="bar"><div class="datepick">
      <button class="btn icon" data-act="prev" aria-label="اليوم السابق">›</button>
      <input type="date" id="dpick" value="${S.date}" aria-label="تاريخ الدوام">
      <button class="btn icon" data-act="next" aria-label="اليوم التالي">‹</button>
      ${S.date!==today()?'<button class="btn sm" data-act="today">اليوم</button>':''}
    </div><strong style="font-family:var(--f-display);font-weight:500">${esc(fmtDate(S.date))}</strong></div>`;
  h+=`<div class="sum"><div class="g"><b>${num(cnt.present)}</b><span>حاضر</span></div><div class="w"><b>${num(cnt.late)}</b><span>متأخر</span></div><div class="r"><b>${num(cnt.absent)}</b><span>غائب</span></div><div class="i"><b>${num(cnt.leave)}</b><span>إجازة</span></div><div><b>${num(un)}</b><span>لم يُسجَّل</span></div></div>`;
  if(!emps.length)return h+noStaff();
  if(un&&canRecord())h+=`<div class="bar"><p class="hint">اضغط الحالة مرة ثانية لإلغائها. النقاط تُحتسب حسب اللائحة وقت التسجيل.</p><button class="btn sm" data-act="allpresent">تسجيل الباقين حضوراً (${num(un)})</button></div>`;
  h+='<div class="list">'+emps.map(e=>{const a=attFor(e.id,S.date);const b=balance(e.id);
    return `<div class="row"><div class="who"><b>${esc(e.name)}</b><span>${esc([e.title,e.office].filter(Boolean).join(' · ')||'—')}</span> <span class="chip ${b<0?'bad':'gold'}">${num(b)} نقطة</span>${a&&a.byName?` <span class="hint">· سجّله ${esc(a.byName)}</span>`:''}</div>
      <div class="seg">${ATT.map(k=>`<button class="${KIND[k].c}" aria-pressed="${!!(a&&a.kind===k)}" data-att="${k}" data-emp="${esc(e.id)}" ${dis}>${KIND[k].l} <span class="pts" style="opacity:.75">${signed(Number(S.rules[k])||0)}</span></button>`).join('')}</div></div>`}).join('')+'</div>';
  return h;
}
function viewPoints(){
  const emps=activeEmps();const m=today().slice(0,7);
  let h=roNote();
  h+=`<div class="bar"><div class="sec"><h2>ترتيب المفاضلة</h2><p class="hint">الرصيد الكلي من الحضور والمكافآت مطروحاً منه الغياب والعقوبات.</p></div>${canRecord()&&emps.length?'<button class="btn primary" data-act="points">مكافأة أو عقوبة</button>':''}</div>`;
  if(!emps.length)return h+noStaff();
  const rows=emps.map(e=>{const ls=S.logs.filter(l=>l.emp===e.id);const mon=ls.filter(l=>(l.date||'').startsWith(m));const c=k=>mon.filter(l=>l.kind===k).length;
    return {e,b:ls.reduce((s,l)=>s+(Number(l.pts)||0),0),md:mon.reduce((s,l)=>s+(Number(l.pts)||0),0),p:c('present'),lt:c('late'),ab:c('absent'),pn:c('penalty')}}).sort((a,b)=>b.b-a.b);
  const max=Math.max(1,...rows.map(r=>r.b));
  h+='<div class="list">'+rows.map((r,i)=>`<div class="rank"><div class="n">${num(i+1)}</div>
    <div class="who"><b>${esc(r.e.name)}</b>
      <div class="mini"><span class="chip good">حضور ${num(r.p)}</span><span class="chip warn">تأخر ${num(r.lt)}</span><span class="chip bad">غياب ${num(r.ab)}</span>${r.pn?`<span class="chip bad">عقوبات ${num(r.pn)}</span>`:''}</div>
      <div class="meter"><i style="width:${Math.max(0,r.b)/max*100}%"></i></div></div>
    <div class="bal ${r.b<0?'neg':''}"><b>${num(r.b)}</b><span>هذا الشهر <span class="pts ${ptsCls(r.md)}">${signed(r.md)}</span></span>${canRecord()?`<button class="btn sm" style="margin-top:6px" data-act="points" data-emp="${esc(r.e.id)}">± نقاط</button>`:''}</div></div>`).join('')+'</div>';
  return h+'<p class="hint">مؤشرات الحضور والتأخر والغياب تخص الشهر الحالي.</p>';
}
function viewLog(){
  const all=S.emps.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  let h=`<div class="bar"><div class="sec"><h2>سجل القيود</h2></div><div class="datepick">
    <select id="lemp" aria-label="الموظف"><option value="">كل الموظفين</option>${all.map(e=>`<option value="${esc(e.id)}" ${S.logEmp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <input type="month" id="lmon" value="${S.logMonth}" aria-label="الشهر"></div></div>`;
  const ls=S.logs.filter(l=>(!S.logEmp||l.emp===S.logEmp)&&(!S.logMonth||(l.date||'').startsWith(S.logMonth))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||'').localeCompare(a.at||''));
  if(!ls.length)return h+'<div class="list"><div class="empty"><b>لا توجد قيود</b>لا يوجد حضور أو نقاط مسجلة لهذا الاختيار.</div></div>';
  const tot=ls.reduce((s,l)=>s+(Number(l.pts)||0),0);
  h+=`<p class="hint">${num(ls.length)} قيد · صافي النقاط <span class="pts ${ptsCls(tot)}">${signed(tot)}</span></p>`;
  h+='<div class="list">'+ls.map(l=>{const k=KIND[l.kind]||{l:l.kind,c:'muted'};return `<div class="log"><time>${esc(shortDate(l.date))}</time>
    <div class="who"><b>${esc(empName(l.emp))} <span class="chip ${k.c}">${k.l}</span></b>${l.note?`<div class="note">${esc(l.note)}</div>`:''}${l.byName?`<div class="note">بواسطة ${esc(l.byName)}</div>`:''}</div>
    <div style="display:flex;gap:8px;align-items:center"><span class="pts ${ptsCls(l.pts)}">${signed(Number(l.pts)||0)}</span>${isAdmin()?`<button class="btn sm danger" data-act="dellog" data-id="${esc(l.id)}">حذف</button>`:''}</div></div>`}).join('')+'</div>';
  return h;
}
function viewStaff(){
  let h=`<div class="bar"><div class="sec"><h2>الموظفون</h2><p class="hint">${num(activeEmps().length)} موظف في الخدمة</p></div><button class="btn primary" data-act="addemp">إضافة موظف</button></div>`;
  if(!S.emps.length)return h+'<div class="list"><div class="empty"><b>القائمة فارغة</b>ابدأ بإضافة أول موظف في المكتب.</div></div>';
  const list=S.emps.slice().sort((a,b)=>(a.archived?1:0)-(b.archived?1:0)||a.name.localeCompare(b.name,'ar'));
  h+='<div class="list">'+list.map(e=>{const b=balance(e.id);const has=S.logs.some(l=>l.emp===e.id);return `<div class="row"><div class="who"><b>${esc(e.name)} ${e.archived?'<span class="chip muted">مؤرشف</span>':''}</b><span>${esc([e.title,e.office].filter(Boolean).join(' · ')||'—')}</span> <span class="chip ${b<0?'bad':'gold'}">${num(b)} نقطة</span></div>
    <div class="seg"><button data-act="editemp" data-id="${esc(e.id)}">تعديل</button><button data-act="${e.archived?'restore':'archive'}" data-id="${esc(e.id)}">${e.archived?'إعادة للخدمة':'أرشفة'}</button>${has?'':`<button data-act="delemp" data-id="${esc(e.id)}">حذف</button>`}</div></div>`}).join('')+'</div>';
  return h+'<p class="hint">الأرشفة تُخفي الموظف من الدوام اليومي والترتيب وتحفظ سجله ونقاطه. الحذف متاح فقط لمن ليس له قيود.</p>';
}
function viewUsers(){
  let h=`<div class="bar"><div class="sec"><h2>المستخدمون</h2><p class="hint">من يدخل التطبيق وماذا يستطيع أن يفعل.</p></div><button class="btn primary" data-act="adduser">إضافة مستخدم</button></div>`;
  h+='<div class="list">'+S.users.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(u=>{const r=ROLES[u.role]||ROLES.viewer;return `<div class="row"><div class="who"><b>${esc(u.name)} ${u.id===S.me.id?'<span class="chip muted">أنت</span>':''}</b><span dir="ltr">${esc(u.username)}</span> <span class="chip ${r.c}">${r.l}</span></div>
    <div class="seg"><button data-act="edituser" data-id="${esc(u.id)}">تعديل</button>${u.id===S.me.id?'':`<button data-act="deluser" data-id="${esc(u.id)}">حذف</button>`}</div></div>`}).join('')+'</div>';
  h+='<div class="card">'+Object.values(ROLES).map(r=>`<p class="hint"><span class="chip ${r.c}">${r.l}</span> ${r.d}</p>`).join('')+'</div>';
  return h;
}
function viewRules(){
  return `<div class="card"><h2>لائحة النقاط</h2><p class="hint">كم نقطة تُمنح أو تُخصم لكل حالة دوام. التغيير يسري على التسجيلات الجديدة فقط ولا يغيّر ما سُجّل سابقاً.</p>
    <div class="rules">${ATT.map(k=>`<label class="f">${KIND[k].l}<input type="number" step="1" id="r_${k}" value="${Number(S.rules[k])||0}"></label>`).join('')}</div>
    <p class="hint">استخدم رقماً سالباً للخصم، مثل −10 للغياب.</p>
    <div><button class="btn primary" data-act="saverules">حفظ اللائحة</button></div></div>`;
}
function render(){
  if(!S.me)return;
  const tabs=TABS.filter(t=>!t[2]||isAdmin());
  if(!tabs.some(t=>t[0]===S.tab))S.tab='day';
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join('');
  const r=ROLES[S.me.role]||ROLES.viewer;
  document.getElementById('me').innerHTML=`<b>${esc(S.me.name)}</b><span class="chip ${r.c}">${r.l}</span><button class="btn link" data-act="mypass">كلمة المرور</button><button class="btn link" data-act="logout">خروج</button>`;
  const app=document.getElementById('app');
  if(!(S.loaded.emps&&S.loaded.logs)){app.innerHTML='<div class="list"><div class="empty"><b>جارٍ تحميل الدفتر…</b>يُجلب الموظفون والسجلات.</div></div>';return}
  app.innerHTML=({day:viewDay,points:viewPoints,log:viewLog,staff:viewStaff,users:viewUsers,rules:viewRules})[S.tab]();
}

/* ===== أحداث ===== */
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;try{localStorage.setItem('dawam_tab',S.tab)}catch(_){}render()});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='dpick'&&e.target.value){S.date=e.target.value;render()}
  if(e.target.id==='lemp'){S.logEmp=e.target.value;render()}
  if(e.target.id==='lmon'){S.logMonth=e.target.value;render()}
});
document.getElementById('shell').addEventListener('click',e=>{
  const at=e.target.closest('[data-att]');if(at){setAtt(at.dataset.emp,at.dataset.att);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;const emp=S.emps.find(x=>x.id===id);const usr=S.users.find(x=>x.id===id);
  switch(b.dataset.act){
    case 'prev':S.date=shift(S.date,-1);render();break;
    case 'next':S.date=shift(S.date,1);render();break;
    case 'today':S.date=today();render();break;
    case 'allpresent':markAllPresent();break;
    case 'points':pointsModal(b.dataset.emp);break;
    case 'addemp':empModal(null);break;
    case 'editemp':empModal(emp);break;
    case 'archive':confirmBox('أرشفة '+emp.name+'؟','سيختفي من الدوام اليومي والترتيب، ويبقى سجله ونقاطه محفوظة.','أرشفة',async()=>{try{await col('employees').doc(id).update({archived:true});toast('أُرشف '+emp.name)}catch(err){fail(err)}});break;
    case 'restore':col('employees').doc(id).update({archived:false}).then(()=>toast('أُعيد '+emp.name+' للخدمة')).catch(fail);break;
    case 'delemp':confirmBox('حذف '+emp.name+'؟','سيُحذف الموظف نهائياً من الدفتر.','حذف نهائي',async()=>{try{await col('employees').doc(id).delete();toast('حُذف الموظف')}catch(err){fail(err)}});break;
    case 'dellog':{const l=S.logs.find(x=>x.id===id);confirmBox('حذف القيد؟',l?empName(l.emp)+' · '+(KIND[l.kind]?.l||'')+' · '+signed(Number(l.pts)||0)+' نقطة':'','حذف القيد',async()=>{try{await col('logs').doc(id).delete();toast('حُذف القيد')}catch(err){fail(err)}});break}
    case 'saverules':{const r={};ATT.forEach(k=>{r[k]=parseInt(document.getElementById('r_'+k).value,10)||0});col('config').doc('rules').set(r).then(()=>toast('حُفظت لائحة النقاط')).catch(fail);break}
    case 'adduser':userModal(null);break;
    case 'edituser':userModal(usr);break;
    case 'deluser':if(usr.role==='admin'&&S.users.filter(x=>x.role==='admin').length<2){toast('لا يمكن حذف آخر مدير نظام');break}
      confirmBox('حذف المستخدم '+usr.name+'؟','لن يستطيع الدخول بعد الآن. قيوده السابقة تبقى في السجل.','حذف',async()=>{try{await col('users').doc(id).delete();toast('حُذف المستخدم')}catch(err){fail(err)}});break;
    case 'mypass':userModal(S.me);break;
    case 'logout':logout();break;
  }
});

/* ===== تشغيل ===== */
try{const t=localStorage.getItem('dawam_tab');if(t)S.tab=t}catch(_){}
try{
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
}catch(e){document.getElementById('gate').innerHTML='<div class="card"><h1>دفتر الدوام والنقاط</h1><p class="err">تعذّر تحميل Firebase. تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p></div>';return}
const onErr=e=>{console.error(e);if(e.code==='permission-denied')document.getElementById('gate').innerHTML='<div class="card"><h1>دفتر الدوام والنقاط</h1><p class="err">قاعدة البيانات ترفض القراءة. أضف قاعدة السماح لمجموعات dawam_ في Firestore (التفاصيل في ملف README).</p></div>'};
col('users').onSnapshot(s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.users=true;route()},onErr);
col('employees').onSnapshot(s=>{S.emps=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.emps=true;render()},onErr);
col('logs').onSnapshot(s=>{S.logs=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.logs=true;render()},onErr);
col('config').doc('rules').onSnapshot(s=>{S.rules=s.exists?{...DEF_RULES,...s.data()}:{...DEF_RULES};render()},onErr);
})();
</script>
</body>
</html>
