<style>
/* Layout: one-column office ledger — maroon header bar with tabs, then a list of staff rows; points shown as a gold "رصيد" chip on every row. */
:root{
  --bg:#f6f0f0; --surface:#ffffff; --raise:#faf5f5; --ink:#2a1215; --muted:#6f5659; --line:#e9dcdd;
  --accent:#7a1f2b; --accent-ink:#ffffff; --accent-soft:#f4e2e4;
  --head:#6b1a26; --head-ink:#ffffff; --head-muted:#e6c4c9;
  --gold:#9a6c14; --gold-soft:#f5ead2;
  --good:#1d7a4b; --good-soft:#ddf1e5; --warn:#a8620a; --warn-soft:#fbeed8;
  --bad:#b0322c; --bad-soft:#f8e2e0; --info:#2b5c86; --info-soft:#e1ebf5;
  --shadow:0 1px 2px rgba(42,18,21,.06),0 6px 20px rgba(42,18,21,.07);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#150b0d; --surface:#211316; --raise:#2a191d; --ink:#f2e7e8; --muted:#b59c9f; --line:#3b2629;
  --accent:#d97a88; --accent-ink:#1a0a0d; --accent-soft:#3f1d23;
  --head:#3e1118; --head-ink:#ffffff; --head-muted:#d6a9b0;
  --gold:#e0b45a; --gold-soft:#3a2f17;
  --good:#5cc78f; --good-soft:#173a28; --warn:#e8a54a; --warn-soft:#3b2b14;
  --bad:#ef7a72; --bad-soft:#3d1d1b; --info:#7fb2e0; --info-soft:#18293a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;text-wrap:balance}
.brand small{display:block;color:var(--head-muted);font-size:.8rem;font-family:var(--f-body);font-weight:400}
.me{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--head-muted);flex-wrap:wrap}
.me b{color:var(--head-ink);font-weight:600}
.me .btn.link{color:var(--head-ink);text-decoration:underline;text-underline-offset:3px}
header.top .me .chip{background:rgba(255,255,255,.16);color:var(--head-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;color:var(--head-muted);font-weight:600;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{color:var(--head-ink)}
nav.tabs button[aria-selected="true"]{background:var(--head-ink);color:var(--head)}
header.top :focus-visible{outline-color:var(--head-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.datepick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.link{border:0;background:transparent;padding:2px 6px;color:var(--accent)}
.icon{width:36px;height:36px;padding:0;justify-content:center}
input[type=date],input[type=month],input[type=text],input[type=password],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.sum span{font-size:.78rem;color:var(--muted)}
.sum .g b{color:var(--good)} .sum .w b{color:var(--warn)} .sum .r b{color:var(--bad)} .sum .i b{color:var(--info)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.who{min-width:0}
.who b{font-weight:600;display:block;overflow-wrap:anywhere}
.who span{color:var(--muted);font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.muted{background:var(--raise);color:var(--muted)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].good{background:var(--good);border-color:var(--good);color:var(--surface)}
.seg button[aria-pressed="true"].warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"].bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seg button[aria-pressed="true"].info{background:var(--info);border-color:var(--info);color:var(--surface)}
.seg button[disabled]{cursor:not-allowed;opacity:.6}
.rank{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font-family:var(--f-display);font-size:1.2rem;color:var(--muted);text-align:center}
.rank:nth-child(1) .n{color:var(--gold)}
.meter{height:6px;background:var(--raise);border-radius:4px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:4px}
.bal{text-align:left}
.bal b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--gold);line-height:1}
.bal.neg b{color:var(--bad)}
.bal span{display:block;font-size:.75rem;color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.log{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.pts.p{color:var(--good)} .pts.m{color:var(--bad)} .pts.z{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2,.sec h2{font-family:var(--f-display);font-weight:500;font-size:1.1rem;margin:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:.95rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.ro-note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em;margin:0}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{width:min(400px,100%);box-shadow:var(--shadow)}
.gate h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0}
.overlay{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);max-height:90%;overflow:auto}
.modal h3{font-family:var(--f-display);font-weight:500;margin:0;font-size:1.15rem}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle button{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--raise);font-weight:600;cursor:pointer}
.toggle button[aria-pressed="true"][data-v="reward"]{background:var(--good);color:var(--surface);border-color:var(--good)}
.toggle button[aria-pressed="true"][data-v="penalty"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;z-index:30;font-weight:500}
.reg-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table.reg{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:100%}
table.reg th,table.reg td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
table.reg thead th{background:var(--raise);font-weight:600;color:var(--muted);font-size:.72rem;line-height:1.3}
table.reg thead th b{display:block;font-size:.85rem;color:var(--ink)}
table.reg .nm{position:sticky;right:0;background:var(--surface);text-align:right;font-weight:600;color:var(--ink);z-index:1;min-width:9rem}
table.reg thead .nm{background:var(--raise)}
table.reg td.off,table.reg th.off{background:var(--raise);color:var(--muted)}
table.reg th.td{outline:2px solid var(--accent);outline-offset:-2px}
table.reg .c-present{color:var(--good);font-weight:700} table.reg .c-late{color:var(--warn);font-weight:700}
table.reg .c-absent{color:var(--bad);font-weight:700;background:var(--bad-soft)} table.reg .c-leave{color:var(--info);font-weight:700}
table.reg .c-none{color:var(--line)}
table.reg .tot{font-weight:700;background:var(--raise)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend b{font-weight:700}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.banner.off{background:var(--raise);color:var(--muted);border:1px dashed var(--line)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tm{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.hol{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:620px){
  .sum{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr)}
  .log{grid-template-columns:minmax(0,1fr) auto}
  .log time{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="gate" class="gate"><div class="card"><h1>دفتر الدوام والنقاط</h1><p class="hint">جارٍ الاتصال بقاعدة البيانات…</p></div></div>

<div id="shell" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>دفتر الدوام والنقاط<small>حضور الكادر ورصيد نقاط المفاضلة</small></h1>
      <div class="me" id="me"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
</div>
<div id="layer"></div>

<script>
(function(){
/* ===== إعدادات Firebase (نفس مشروع السكرتارية، بمجموعات منفصلة تبدأ بـ dawam_) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAtTT49vBJUdXV4HjoY4vKg6q51kl-S3oU",
  authDomain: "secretariat-tasks-4672b.firebaseapp.com",
  projectId: "secretariat-tasks-4672b",
  storageBucket: "secretariat-tasks-4672b.firebasestorage.app",
  messagingSenderId: "781468159621",
  appId: "1:781468159621:web:97c25082ef4fadd1b8e3ec"
};
const PREFIX='dawam_';

const DEF_RULES={present:5,late:2,absent:-10,leave:0};
const KIND={present:{l:'حاضر',c:'good'},late:{l:'متأخر',c:'warn'},absent:{l:'غائب',c:'bad'},leave:{l:'إجازة',c:'info'},reward:{l:'مكافأة',c:'good'},penalty:{l:'عقوبة',c:'bad'}};
const ATT=['present','late','absent','leave'];
const ROLES={admin:{l:'مدير النظام',c:'acc',d:'كل الصلاحيات: الموظفون، المستخدمون، لائحة النقاط، أيام وأوقات الدوام، حذف القيود'},recorder:{l:'مسجّل دوام',c:'gold',d:'تسجيل الحضور والغياب والمكافآت والعقوبات، وتحديد أيام وأوقات الدوام'},viewer:{l:'اطلاع فقط',c:'muted',d:'يرى الحضور والترتيب والسجل دون تعديل'}};
const TABS=[['day','الدوام اليومي'],['register','السجل الشهري'],['points','النقاط والترتيب'],['log','القيود'],['sched','أيام الدوام','rec'],['staff','الموظفون','admin'],['users','المستخدمون','admin'],['rules','لائحة النقاط','admin']];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WDS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const CODE={present:'ح',late:'ت',absent:'غ',leave:'إ'};
const DEF_SCHED={days:[true,true,true,true,true,true,true],start:'17:00',end:'22:00',grace:15,holidays:[],extra:[]};

const S={emps:[],logs:[],users:[],rules:{...DEF_RULES},sched:{...DEF_SCHED},date:today(),tab:'day',logEmp:'',logMonth:today().slice(0,7),regMonth:today().slice(0,7),regOffice:'',regQ:'',regFilter:'',
  me:null,loaded:{emps:false,logs:false,users:false}};
let db;
const col=n=>db.collection(PREFIX+n);

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(ds,n){const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const nf=new Intl.NumberFormat('ar-IQ');
const num=n=>nf.format(n);
const signed=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'0';
const ptsCls=n=>n>0?'p':n<0?'m':'z';
function fmtDate(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function shortDate(ds){if(!ds)return '';const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-IQ',{day:'numeric',month:'short'})}
const empName=id=>(S.emps.find(x=>x.id===id)||{name:'موظف محذوف'}).name;
const activeEmps=()=>S.emps.filter(e=>!e.archived).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const balance=id=>S.logs.reduce((s,l)=>l.emp===id?s+(Number(l.pts)||0):s,0);
const attFor=(id,date)=>S.logs.find(l=>l.id==='att_'+date+'_'+id);
const wday=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const isWork=ds=>{const sc=S.sched;if((sc.extra||[]).includes(ds))return true;if((sc.holidays||[]).includes(ds))return false;return !!(sc.days||DEF_SCHED.days)[wday(ds)]};
const mins=hm=>{const [h,m]=(hm||'0:0').split(':').map(Number);return h*60+m};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function t12(hm){if(!hm)return '';let [h,m]=hm.split(':').map(Number);const p=h>=12?'م':'ص';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+p}
const hours=()=>t12(S.sched.start)+' – '+t12(S.sched.end);
const isAdmin=()=>S.me&&S.me.role==='admin';
const canRecord=()=>S.me&&(S.me.role==='admin'||S.me.role==='recorder');
async function hash(u,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dawam|'+u.toLowerCase()+'|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const stamp=()=>({at:new Date().toISOString(),by:S.me?S.me.id:'',byName:S.me?S.me.name:''});

let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function fail(e){console.error(e);toast(e&&e.code==='permission-denied'?'قاعدة البيانات رفضت الحفظ. راجع قواعد Firestore لمجموعات dawam_':'تعذّر الحفظ، تحقق من الاتصال بالإنترنت');}

/* ===== كتابة ===== */
async function setAtt(emp,kind){
  if(!canRecord()||!isWork(S.date))return;
  const id='att_'+S.date+'_'+emp;const cur=attFor(emp,S.date);
  try{
    if(cur&&cur.kind===kind){await col('logs').doc(id).delete();return}
    let k=kind,time='';
    if((k==='present'||k==='late')&&S.date===today()){
      time=nowHM();
      if(k==='present'&&mins(time)>mins(S.sched.start)+(Number(S.sched.grace)||0)){k='late';toast('سُجّل متأخراً: الحضور '+t12(time)+' بعد بداية الدوام '+t12(S.sched.start))}
    }
    await col('logs').doc(id).set({emp,kind:k,pts:Number(S.rules[k])||0,date:S.date,time,note:'',...stamp()});
  }catch(e){fail(e)}
}
async function markAllPresent(){
  if(!isWork(S.date))return;
  const todo=activeEmps().filter(e=>!attFor(e.id,S.date));
  const batch=db.batch();const time=S.date===today()?nowHM():'';
  todo.forEach(e=>batch.set(col('logs').doc('att_'+S.date+'_'+e.id),{emp:e.id,kind:'present',pts:Number(S.rules.present)||0,date:S.date,time,note:'',...stamp()}));
  try{await batch.commit();toast('سُجّل حضور '+num(todo.length)+' موظف')}catch(e){fail(e)}
}
async function saveSched(patch){
  try{await col('config').doc('schedule').set({...S.sched,...patch})}catch(e){fail(e);return false}
  return true;
}
async function toggleDate(ds){
  const sc=S.sched;let holidays=[...(sc.holidays||[])],extra=[...(sc.extra||[])];
  if(isWork(ds)){if(extra.includes(ds))extra=extra.filter(x=>x!==ds);else holidays.push(ds)}
  else{if(holidays.includes(ds))holidays=holidays.filter(x=>x!==ds);else extra.push(ds)}
  if(await saveSched({holidays:holidays.sort(),extra:extra.sort()}))toast(isWorkAfter(ds,holidays,extra)?'أصبح '+fmtDate(ds)+' يوم دوام':'أصبح '+fmtDate(ds)+' يوم عطلة');
}
function isWorkAfter(ds,h,x){if(x.includes(ds))return true;if(h.includes(ds))return false;return !!(S.sched.days||DEF_SCHED.days)[wday(ds)]}
function monthDays(ym){const [y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>ym+'-'+String(i+1).padStart(2,'0'))}
const offices=()=>[...new Set(S.emps.map(e=>(e.office||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
const sumPts=a=>a.reduce((s,l)=>s+(Number(l.pts)||0),0);
function regData(ym){
  const days=monthDays(ym);const t=today();const q=(S.regQ||'').trim();
  let emps=S.emps.filter(e=>!e.archived||S.logs.some(l=>l.emp===e.id&&(l.date||'').startsWith(ym)));
  if(S.regOffice)emps=emps.filter(e=>(e.office||'').trim()===S.regOffice);
  if(q)emps=emps.filter(e=>(e.name+' '+(e.title||'')+' '+(e.office||'')).includes(q));
  emps.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  let rows=emps.map(e=>{
    const c={present:0,late:0,absent:0,leave:0};let due=0;
    const cells=days.map(ds=>{const a=attFor(e.id,ds);const w=isWork(ds);if(a&&c[a.kind]!=null)c[a.kind]++;if(w&&ds<=t)due++;return {ds,w,a}});
    const rec=c.present+c.late+c.absent+c.leave;const base=due-c.leave;
    const ml=S.logs.filter(l=>l.emp===e.id&&(l.date||'').startsWith(ym));const rw=ml.filter(l=>l.kind==='reward'),pn=ml.filter(l=>l.kind==='penalty');
    return {e,cells,c,due,missing:Math.max(0,due-rec),rate:base>0?Math.round((c.present+c.late)/base*100):null,mpts:sumPts(ml),bal:balance(e.id),rw:rw.length,rwp:sumPts(rw),pn:pn.length,pnp:sumPts(pn),logs:ml};
  });
  const f=S.regFilter;
  if(f)rows=rows.filter(r=>f==='absent'?r.c.absent>0:f==='late'?r.c.late>0:f==='missing'?r.missing>0:f==='penalty'?r.pn>0:f==='clean'?(r.due>0&&!r.missing&&!r.c.absent&&!r.c.late):true);
  return {days,emps:rows};
}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)});
}
async function exportXLSX(){
  const {days,emps}=regData(S.regMonth);
  if(!emps.length){toast('لا يوجد موظفون ضمن الفلتر الحالي');return}
  toast('جارٍ تجهيز ملف Excel…');
  let X;try{X=await loadXLSX()}catch(e){toast('تعذّر تحميل أداة Excel، تحقق من الاتصال بالإنترنت');return}
  const sheet=(rows,widths)=>{const ws=X.utils.aoa_to_sheet(rows);ws['!autofilter']={ref:ws['!ref']};ws['!cols']=widths.map(w=>({wch:w}));return ws};
  const sum=[['ت','الموظف','العنوان الوظيفي','المكتب','الحالة','أيام الدوام المنقضية','حضور','تأخر','غياب','إجازة','غير مسجل','نسبة الحضور %','عدد المكافآت','نقاط المكافآت','عدد العقوبات','نقاط العقوبات','نقاط الشهر','الرصيد الكلي'],
    ...emps.map((r,i)=>[i+1,r.e.name,r.e.title||'',r.e.office||'',r.e.archived?'مؤرشف':'في الخدمة',r.due,r.c.present,r.c.late,r.c.absent,r.c.leave,r.missing,r.rate??'',r.rw,r.rwp,r.pn,r.pnp,r.mpts,r.bal])];
  const grid=[['الموظف','المكتب',...days.map(d=>Number(d.slice(8))+' '+WDS[wday(d)])],
    ...emps.map(r=>[r.e.name,r.e.office||'',...r.cells.map(x=>x.a?(KIND[x.a.kind]?.l||'')+(x.a.time?' '+t12(x.a.time):''):(x.w?(x.ds<=today()?'غير مسجل':''):'عطلة'))])];
  const det=[['التاريخ','اليوم','الموظف','العنوان الوظيفي','المكتب','النوع','وقت الحضور','النقاط','السبب','سجّله'],
    ...emps.flatMap(r=>r.logs.map(l=>[l.date,WD[wday(l.date)],r.e.name,r.e.title||'',r.e.office||'',KIND[l.kind]?.l||l.kind,l.time?t12(l.time):'',Number(l.pts)||0,l.note||'',l.byName||''])).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||String(a[2]).localeCompare(String(b[2]),'ar'))];
  const wb=X.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  X.utils.book_append_sheet(wb,sheet(sum,[5,24,18,16,10,12,7,7,7,7,9,12,10,11,10,11,10,11]),'ملخص الشهر');
  X.utils.book_append_sheet(wb,sheet(grid,[24,16,...days.map(()=>11)]),'الحضور اليومي');
  X.utils.book_append_sheet(wb,sheet(det,[11,10,24,18,16,10,11,8,34,16]),'تفاصيل القيود');
  X.writeFile(wb,'سجل-الدوام-'+S.regMonth+'.xlsx');
}

/* ===== نوافذ ===== */
function modal(html,onMount){
  const L=document.getElementById('layer');
  L.innerHTML='<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  const ov=document.getElementById('ov');
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.addEventListener('keydown',escClose);
  onMount&&onMount(ov.firstChild);
  const f=ov.querySelector('input:not([disabled]),select');f&&f.focus();
}
function escClose(e){if(e.key==='Escape')close()}
function close(){document.getElementById('layer').innerHTML='';document.removeEventListener('keydown',escClose)}
function confirmBox(title,text,okLabel,fn){
  modal('<h3>'+esc(title)+'</h3><p class="hint">'+esc(text)+'</p><div class="acts"><button class="btn danger" id="ok">'+esc(okLabel)+'</button><button class="btn" id="cn">تراجع</button></div>',m=>{
    m.querySelector('#cn').onclick=close;

/* ===== شاشات الدخول ===== */
function gateSetup(){
  const g=document.getElementById('gate');g.hidden=false;document.getElementById('shell').hidden=true;
  g.innerHTML=`<form class="card" id="sf"><h1>دفتر الدوام والنقاط</h1><p class="hint">أول تشغيل: أنشئ حساب مدير النظام. بعدها تضيف بقية المستخدمين من داخل التطبيق.</p>
    <label class="f">الاسم الظاهر<input id="sn" type="text" required></label>
    <label class="f">اسم الدخول<input id="su" type="text" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input id="sp" type="password" autocomplete="new-password" required></label>
    <p class="err" id="se"></p><button class="btn primary" type="submit">إنشاء الحساب والدخول</button></form>`;
  document.getElementById('sf').onsubmit=async e=>{
    e.preventDefault();const er=document.getElementById('se');
    const name=document.getElementById('sn').value.trim(),username=document.getElementById('su').value.trim().toLowerCase(),pass=document.getElementById('sp').value;
    if(!/^[a-z0-9._-]{3,}$/.test(username)){er.textContent='اسم الدخول: 3 أحرف إنجليزية أو أرقام على الأقل';return}
    if(pass.length<6){er.textContent='كلمة المرور 6 أحرف على الأقل';return}
    try{const ref=await col('users').add({name,username,role:'admin',pass:await hash(username,pass),createdAt:new Date().toISOString()});login(ref.id)}catch(err){er.textContent='تعذّر الإنشاء: '+(err.code==='permission-denied'?'قواعد Firestore ترفض الكتابة':'تحقق من الاتصال')}
  };
}
function gateLogin(){
  const g=document.getElementById('gate');g.hidden=false;document.getElementById('shell').hidden=true;
  g.innerHTML=`<form class="card" id="lf"><h1>دفتر الدوام والنقاط</h1><p class="hint">سجّل الدخول بحسابك.</p>
    <label class="f">اسم الدخول<input id="lu" type="text" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input id="lp" type="password" autocomplete="current-password" required></label>
    <p class="err" id="le"></p><button class="btn primary" type="submit">دخول</button></form>`;
  document.getElementById('lu').focus();
  document.getElementById('lf').onsubmit=async e=>{
    e.preventDefault();
    const u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;
    const acc=S.users.find(x=>x.username===u);
    if(acc&&acc.pass===await hash(u,p))login(acc.id);else document.getElementById('le').textContent='اسم الدخول أو كلمة المرور غير صحيحة';
  };
}
function login(id){try{localStorage.setItem('dawam_session',id)}catch(_){}S.me=S.users.find(u=>u.id===id)||null;route()}
function logout(){try{localStorage.removeItem('dawam_session')}catch(_){}S.me=null;route()}
function route(){
  if(!S.loaded.users)return;
  if(!S.users.length){gateSetup();return}
  if(!S.me){let sid=null;try{sid=localStorage.getItem('dawam_session')}catch(_){}S.me=S.users.find(u=>u.id===sid)||null}
  else S.me=S.users.find(u=>u.id===S.me.id)||null;
  if(!S.me){gateLogin();return}
  document.getElementById('gate').hidden=true;document.getElementById('shell').hidden=false;
  render();
}

  h+=`<div class="datepick"><input type="month" id="rmon" value="${S.regMonth}" aria-label="الشهر">
    <select id="roff" aria-label="المكتب"><option value="">كل المكاتب</option>${offices().map(o=>`<option ${S.regOffice===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <select id="rflt" aria-label="تصفية"><option value="">كل الموظفين</option>${[['absent','لديهم غياب'],['late','لديهم تأخير'],['missing','لديهم أيام غير مسجلة'],['penalty','لديهم عقوبات'],['clean','دوام كامل بلا غياب أو تأخير']].map(([v,l])=>`<option value="${v}" ${S.regFilter===v?'selected':''}>${l}</option>`).join('')}</select>
    <input type="text" id="rq" value="${esc(S.regQ)}" placeholder="بحث بالاسم أو العنوان" aria-label="بحث">
    ${S.regOffice||S.regFilter||S.regQ?'<button class="btn sm" data-act="rclear">مسح الفلتر</button>':''}</div>`;
  h+=`<div class="legend"><span><b style="color:var(--good)">ح</b> حاضر</span><span><b style="color:var(--warn)">ت</b> متأخر</span><span><b style="color:var(--bad)">غ</b> غائب</span><span><b style="color:var(--info)">إ</b> إجازة</span><span><b>·</b> لم يُسجَّل</span><span>الخانات الرمادية أيام عطلة</span></div>`;
  if(!S.emps.length)return h+noStaff();
  if(!emps.length)return h+'<div class="list"><div class="empty"><b>لا يوجد موظفون ضمن هذا الفلتر</b>غيّر المكتب أو نوع التصفية أو امسح البحث.</div></div>';
  h+=`<p class="hint">${num(emps.length)} موظف · ملف Excel يصدر بثلاث أوراق: ملخص الشهر، الحضور اليومي، تفاصيل القيود، وكل عمود فيه زر فلترة.</p>`;
  h+='<div class="reg-wrap"><table class="reg"><thead><tr><th class="nm">الموظف</th>'+days.map(ds=>`<th class="${isWork(ds)?'':'off'} ${ds===t?'td':''}"><b>${num(Number(ds.slice(8)))}</b>${WDS[wday(ds)]}</th>`).join('')+'<th>حضور</th><th>تأخر</th><th>غياب</th><th>إجازة</th><th>غير مسجل</th><th>النسبة</th><th>نقاط الشهر</th><th>الرصيد</th></tr></thead><tbody>';
  h+=emps.map(r=>`<tr><td class="nm">${esc(r.e.name)}${r.e.archived?' <span class="chip muted">مؤرشف</span>':''}${r.e.title||r.e.office?`<div class="note">${esc([r.e.title,r.e.office].filter(Boolean).join(' · '))}</div>`:''}</td>`+r.cells.map(x=>{
      if(x.a)return `<td class="c-${x.a.kind} ${x.w?'':'off'}" title="${esc(KIND[x.a.kind]?.l||'')}${x.a.time?' '+esc(t12(x.a.time)):''}">${CODE[x.a.kind]||''}</td>`;
      return `<td class="${x.w?'c-none':'off'}">${x.w&&x.ds<=t?'·':''}</td>`}).join('')
    +`<td class="tot" style="color:var(--good)">${num(r.c.present)}</td><td class="tot" style="color:var(--warn)">${num(r.c.late)}</td><td class="tot" style="color:var(--bad)">${num(r.c.absent)}</td><td class="tot" style="color:var(--info)">${num(r.c.leave)}</td><td class="tot">${num(r.missing)}</td><td class="tot">${r.rate==null?'—':num(r.rate)+'٪'}</td><td class="tot"><span class="pts ${ptsCls(r.mpts)}">${signed(r.mpts)}</span></td><td class="tot" style="color:${r.bal<0?'var(--bad)':'var(--gold)'}">${num(r.bal)}</td></tr>`).join('');
  h+='</tbody></table></div><p class="hint">النسبة = (الحضور + التأخر) ÷ أيام الدوام المنقضية بعد طرح الإجازات.</p>';
  return h;
}
function viewSched(){
  const sc=S.sched;const up=(sc.holidays||[]).filter(d=>d>=today().slice(0,7)+'-01');
  return `<div class="card"><h2>أيام الدوام الأسبوعية</h2><p class="hint">اختر الأيام التي يداوم فيها الكادر. الأيام غير المختارة تُعامل عطلة ولا يُسجَّل فيها غياب.</p>
    <div class="days" id="wdays">${WD.map((d,i)=>`<button type="button" data-act="wdtoggle" data-i="${i}" aria-pressed="${!!(sc.days||DEF_SCHED.days)[i]}">${d}</button>`).join('')}</div></div>
  <div class="card"><h2>أوقات الدوام</h2>
    <div class="form"><label class="f">بداية الدوام<input type="time" id="s_start" value="${esc(sc.start||'17:00')}"></label>
    <label class="f">نهاية الدوام<input type="time" id="s_end" value="${esc(sc.end||'22:00')}"></label>
    <label class="f">سماحية التأخير (دقيقة)<input type="number" min="0" step="5" id="s_grace" value="${Number(sc.grace)||0}"></label></div>
    <p class="hint">من يُسجَّل حاضراً بعد بداية الدوام بأكثر من مدة السماحية يُحتسب متأخراً تلقائياً.</p>
    <div><button class="btn primary" data-act="savesched">حفظ أيام وأوقات الدوام</button></div></div>
  <div class="card"><h2>العطل الرسمية</h2><p class="hint">أيام لا دوام فيها حتى لو كانت ضمن أيام الأسبوع، مثل المناسبات والعطل الرسمية.</p>
    <div class="datepick"><input type="date" id="h_date" aria-label="تاريخ العطلة"><button class="btn sm" data-act="addhol">إضافة عطلة</button></div>
    <div class="hol">${up.length?up.map(d=>`<span class="chip muted">${esc(fmtDate(d))} <button class="btn link" data-act="delhol" data-d="${d}" aria-label="حذف العطلة">×</button></span>`).join(''):'<span class="hint">لا توجد عطل مضافة.</span>'}</div></div>`;
}
function viewPoints(){
  const emps=activeEmps();const m=today().slice(0,7);
  let h=roNote();
  h+=`<div class="bar"><div class="sec"><h2>ترتيب المفاضلة</h2><p class="hint">الرصيد الكلي من الحضور والمكافآت مطروحاً منه الغياب والعقوبات.</p></div>${canRecord()&&emps.length?'<button class="btn primary" data-act="points">مكافأة أو عقوبة</button>':''}</div>`;
  if(!emps.length)return h+noStaff();
  const rows=emps.map(e=>{const ls=S.logs.filter(l=>l.emp===e.id);const mon=ls.filter(l=>(l.date||'').startsWith(m));const c=k=>mon.filter(l=>l.kind===k).length;
    return {e,b:ls.reduce((s,l)=>s+(Number(l.pts)||0),0),md:mon.reduce((s,l)=>s+(Number(l.pts)||0),0),p:c('present'),lt:c('late'),ab:c('absent'),pn:c('penalty')}}).sort((a,b)=>b.b-a.b);
  const max=Math.max(1,...rows.map(r=>r.b));
  h+='<div class="list">'+rows.map((r,i)=>`<div class="rank"><div class="n">${num(i+1)}</div>
    <div class="who"><b>${esc(r.e.name)}</b>
      <div class="mini"><span class="chip good">حضور ${num(r.p)}</span><span class="chip warn">تأخر ${num(r.lt)}</span><span class="chip bad">غياب ${num(r.ab)}</span>${r.pn?`<span class="chip bad">عقوبات ${num(r.pn)}</span>`:''}</div>
      <div class="meter"><i style="width:${Math.max(0,r.b)/max*100}%"></i></div></div>
    <div class="bal ${r.b<0?'neg':''}"><b>${num(r.b)}</b><span>هذا الشهر <span class="pts ${ptsCls(r.md)}">${signed(r.md)}</span></span>${canRecord()?`<button class="btn sm" style="margin-top:6px" data-act="points" data-emp="${esc(r.e.id)}">± نقاط</button>`:''}</div></div>`).join('')+'</div>';
  return h+'<p class="hint">مؤشرات الحضور والتأخر والغياب تخص الشهر الحالي.</p>';
}
function viewLog(){
  const all=S.emps.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  let h=`<div class="bar"><div class="sec"><h2>سجل القيود</h2></div><div class="datepick">
    <select id="lemp" aria-label="الموظف"><option value="">كل الموظفين</option>${all.map(e=>`<option value="${esc(e.id)}" ${S.logEmp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <input type="month" id="lmon" value="${S.logMonth}" aria-label="الشهر"></div></div>`;
  const ls=S.logs.filter(l=>(!S.logEmp||l.emp===S.logEmp)&&(!S.logMonth||(l.date||'').startsWith(S.logMonth))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||'').localeCompare(a.at||''));
  if(!ls.length)return h+'<div class="list"><div class="empty"><b>لا توجد قيود</b>لا يوجد حضور أو نقاط مسجلة لهذا الاختيار.</div></div>';
  const tot=ls.reduce((s,l)=>s+(Number(l.pts)||0),0);
  h+=`<p class="hint">${num(ls.length)} قيد · صافي النقاط <span class="pts ${ptsCls(tot)}">${signed(tot)}</span></p>`;
  h+='<div class="list">'+ls.map(l=>{const k=KIND[l.kind]||{l:l.kind,c:'muted'};return `<div class="log"><time>${esc(shortDate(l.date))}</time>
    <div class="who"><b>${esc(empName(l.emp))} <span class="chip ${k.c}">${k.l}</span>${l.time?` <span class="chip muted"><span class="tm">${esc(t12(l.time))}</span></span>`:''}</b>${l.note?`<div class="note">${esc(l.note)}</div>`:''}${l.byName?`<div class="note">بواسطة ${esc(l.byName)}</div>`:''}</div>
    <div style="display:flex;gap:8px;align-items:center"><span class="pts ${ptsCls(l.pts)}">${signed(Number(l.pts)||0)}</span>${isAdmin()?`<button class="btn sm danger" data-act="dellog" data-id="${esc(l.id)}">حذف</button>`:''}</div></div>`}).join('')+'</div>';
  return h;
}
function viewStaff(){
  let h=`<div class="bar"><div class="sec"><h2>الموظفون</h2><p class="hint">${num(activeEmps().length)} موظف في الخدمة</p></div><button class="btn primary" data-act="addemp">إضافة موظف</button></div>`;
  if(!S.emps.length)return h+'<div class="list"><div class="empty"><b>القائمة فارغة</b>ابدأ بإضافة أول موظف في المكتب.</div></div>';
  const list=S.emps.slice().sort((a,b)=>(a.archived?1:0)-(b.archived?1:0)||a.name.localeCompare(b.name,'ar'));
  h+='<div class="list">'+list.map(e=>{const b=balance(e.id);const has=S.logs.some(l=>l.emp===e.id);return `<div class="row"><div class="who"><b>${esc(e.name)} ${e.archived?'<span class="chip muted">مؤرشف</span>':''}</b><span>${esc([e.title,e.office].filter(Boolean).join(' · ')||'—')}</span> <span class="chip ${b<0?'bad':'gold'}">${num(b)} نقطة</span></div>
    <div class="seg"><button data-act="editemp" data-id="${esc(e.id)}">تعديل</button><button data-act="${e.archived?'restore':'archive'}" data-id="${esc(e.id)}">${e.archived?'إعادة للخدمة':'أرشفة'}</button>${has?'':`<button data-act="delemp" data-id="${esc(e.id)}">حذف</button>`}</div></div>`}).join('')+'</div>';
  return h+'<p class="hint">الأرشفة تُخفي الموظف من الدوام اليومي والترتيب وتحفظ سجله ونقاطه. الحذف متاح فقط لمن ليس له قيود.</p>';
}
function viewUsers(){
  let h=`<div class="bar"><div class="sec"><h2>المستخدمون</h2><p class="hint">من يدخل التطبيق وماذا يستطيع أن يفعل.</p></div><button class="btn primary" data-act="adduser">إضافة مستخدم</button></div>`;
  h+='<div class="list">'+S.users.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(u=>{const r=ROLES[u.role]||ROLES.viewer;return `<div class="row"><div class="who"><b>${esc(u.name)} ${u.id===S.me.id?'<span class="chip muted">أنت</span>':''}</b><span dir="ltr">${esc(u.username)}</span> <span class="chip ${r.c}">${r.l}</span></div>
    <div class="seg"><button data-act="edituser" data-id="${esc(u.id)}">تعديل</button>${u.id===S.me.id?'':`<button data-act="deluser" data-id="${esc(u.id)}">حذف</button>`}</div></div>`}).join('')+'</div>';
  h+='<div class="card">'+Object.values(ROLES).map(r=>`<p class="hint"><span class="chip ${r.c}">${r.l}</span> ${r.d}</p>`).join('')+'</div>';
  return h;
}
function viewRules(){
  return `<div class="card"><h2>لائحة النقاط</h2><p class="hint">كم نقطة تُمنح أو تُخصم لكل حالة دوام. التغيير يسري على التسجيلات الجديدة فقط ولا يغيّر ما سُجّل سابقاً.</p>
    <div class="rules">${ATT.map(k=>`<label class="f">${KIND[k].l}<input type="number" step="1" id="r_${k}" value="${Number(S.rules[k])||0}"></label>`).join('')}</div>
    <p class="hint">استخدم رقماً سالباً للخصم، مثل −10 للغياب.</p>
    <div><button class="btn primary" data-act="saverules">حفظ اللائحة</button></div></div>`;
}
function render(){
  if(!S.me)return;
  const tabs=TABS.filter(t=>!t[2]||(t[2]==='rec'?canRecord():isAdmin()));
  if(!tabs.some(t=>t[0]===S.tab))S.tab='day';
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join('');
  const r=ROLES[S.me.role]||ROLES.viewer;
  document.getElementById('me').innerHTML=`<b>${esc(S.me.name)}</b><span class="chip ${r.c}">${r.l}</span><button class="btn link" data-act="mypass">كلمة المرور</button><button class="btn link" data-act="logout">خروج</button>`;
  const app=document.getElementById('app');
  if(!(S.loaded.emps&&S.loaded.logs)){app.innerHTML='<div class="list"><div class="empty"><b>جارٍ تحميل الدفتر…</b>يُجلب الموظفون والسجلات.</div></div>';return}
  app.innerHTML=({day:viewDay,register:viewRegister,points:viewPoints,log:viewLog,sched:viewSched,staff:viewStaff,users:viewUsers,rules:viewRules})[S.tab]();
}

/* ===== أحداث ===== */
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;try{localStorage.setItem('dawam_tab',S.tab)}catch(_){}render()});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='dpick'&&e.target.value){S.date=e.target.value;render()}
  if(e.target.id==='lemp'){S.logEmp=e.target.value;render()}
  if(e.target.id==='lmon'){S.logMonth=e.target.value;render()}
  if(e.target.id==='rmon'&&e.target.value){S.regMonth=e.target.value;render()}
  if(e.target.id==='roff'){S.regOffice=e.target.value;render()}
  if(e.target.id==='rflt'){S.regFilter=e.target.value;render()}
  if(e.target.id==='rq'){S.regQ=e.target.value;render()}
});
document.getElementById('shell').addEventListener('click',e=>{
  const at=e.target.closest('[data-att]');if(at){setAtt(at.dataset.emp,at.dataset.att);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;const emp=S.emps.find(x=>x.id===id);const usr=S.users.find(x=>x.id===id);
  switch(b.dataset.act){
    case 'prev':S.date=shift(S.date,-1);render();break;
    case 'next':S.date=shift(S.date,1);render();break;
    case 'today':S.date=today();render();break;
    case 'allpresent':markAllPresent();break;
    case 'toggleday':toggleDate(S.date);break;
    case 'csv':exportXLSX();break;
    case 'rclear':S.regOffice='';S.regFilter='';S.regQ='';render();break;
    case 'wdtoggle':b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');break;
    case 'savesched':{const days=[...document.querySelectorAll('#wdays button')].map(x=>x.getAttribute('aria-pressed')==='true');
      const start=document.getElementById('s_start').value,end=document.getElementById('s_end').value,grace=Math.max(0,parseInt(document.getElementById('s_grace').value,10)||0);
      if(!days.some(Boolean)){toast('اختر يوم دوام واحداً على الأقل');break}
      if(!start||!end||mins(end)<=mins(start)){toast('وقت نهاية الدوام يجب أن يكون بعد وقت البداية');break}
      saveSched({days,start,end,grace}).then(ok=>ok&&toast('حُفظت أيام وأوقات الدوام'));break}
    case 'addhol':{const d=document.getElementById('h_date').value;if(!d){toast('اختر تاريخ العطلة');break}
      const holidays=[...new Set([...(S.sched.holidays||[]),d])].sort(),extra=(S.sched.extra||[]).filter(x=>x!==d);
      saveSched({holidays,extra}).then(ok=>ok&&toast('أُضيفت العطلة: '+fmtDate(d)));break}
    case 'delhol':{const d=b.dataset.d;saveSched({holidays:(S.sched.holidays||[]).filter(x=>x!==d)}).then(ok=>ok&&toast('حُذفت العطلة'));break}
    case 'points':pointsModal(b.dataset.emp);break;
    case 'addemp':empModal(null);break;
    case 'editemp':empModal(emp);break;
    case 'archive':confirmBox('أرشفة '+emp.name+'؟','سيختفي من الدوام اليومي والترتيب، ويبقى سجله ونقاطه محفوظة.','أرشفة',async()=>{try{await col('employees').doc(id).update({archived:true});toast('أُرشف '+emp.name)}catch(err){fail(err)}});break;
    case 'restore':col('employees').doc(id).update({archived:false}).then(()=>toast('أُعيد '+emp.name+' للخدمة')).catch(fail);break;
    case 'delemp':confirmBox('حذف '+emp.name+'؟','سيُحذف الموظف نهائياً من الدفتر.','حذف نهائي',async()=>{try{await col('employees').doc(id).delete();toast('حُذف الموظف')}catch(err){fail(err)}});break;
    case 'dellog':{const l=S.logs.find(x=>x.id===id);confirmBox('حذف القيد؟',l?empName(l.emp)+' · '+(KIND[l.kind]?.l||'')+' · '+signed(Number(l.pts)||0)+' نقطة':'','حذف القيد',async()=>{try{await col('logs').doc(id).delete();toast('حُذف القيد')}catch(err){fail(err)}});break}
    case 'saverules':{const r={};ATT.forEach(k=>{r[k]=parseInt(document.getElementById('r_'+k).value,10)||0});col('config').doc('rules').set(r).then(()=>toast('حُفظت لائحة النقاط')).catch(fail);break}
    case 'adduser':userModal(null);break;
    case 'edituser':userModal(usr);break;
    case 'deluser':if(usr.role==='admin'&&S.users.filter(x=>x.role==='admin').length<2){toast('لا يمكن حذف آخر مدير نظام');break}
      confirmBox('حذف المستخدم '+usr.name+'؟','لن يستطيع الدخول بعد الآن. قيوده السابقة تبقى في السجل.','حذف',async()=>{try{await col('users').doc(id).delete();toast('حُذف المستخدم')}catch(err){fail(err)}});break;
    case 'mypass':userModal(S.me);break;
    case 'logout':logout();break;
  }
});

/* ===== تشغيل ===== */
try{const t=localStorage.getItem('dawam_tab');if(t)S.tab=t}catch(_){}
try{
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
}catch(e){document.getElementById('gate').innerHTML='<div class="card"><h1>دفتر الدوام والنقاط</h1><p class="err">تعذّر تحميل Firebase. تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p></div>';return}
const onErr=e=>{console.error(e);if(e.code==='permission-denied')document.getElementById('gate').innerHTML='<div class="card"><h1>دفتر الدوام والنقاط</h1><p class="err">قاعدة البيانات ترفض القراءة. أضف قاعدة السماح لمجموعات dawam_ في Firestore (التفاصيل في ملف README).</p></div>'};
col('users').onSnapshot(s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.users=true;route()},onErr);
col('employees').onSnapshot(s=>{S.emps=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.emps=true;render()},onErr);
col('logs').onSnapshot(s=>{S.logs=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.logs=true;render()},onErr);
col('config').doc('schedule').onSnapshot(s=>{S.sched=s.exists?{...DEF_SCHED,...s.data()}:{...DEF_SCHED};render()},onErr);
col('config').doc('rules').onSnapshot(s=>{S.rules=s.exists?{...DEF_RULES,...s.data()}:{...DEF_RULES};render()},onErr);
})();
</script>
</body>
</html>
