<style>
/* Layout: one-column office ledger — maroon header bar with tabs, then a list of staff rows; points shown as a gold "رصيد" chip on every row. */
:root{
  --bg:#f6f0f0; --surface:#ffffff; --raise:#faf5f5; --ink:#2a1215; --muted:#6f5659; --line:#e9dcdd;
  --accent:#7a1f2b; --accent-ink:#ffffff; --accent-soft:#f4e2e4;
  --head:#6b1a26; --head-ink:#ffffff; --head-muted:#e6c4c9;
  --grad-page:linear-gradient(160deg,#3a0912 0%,#651826 38%,#8c2a3b 72%,#a43d4f 100%);
  --grad-head:linear-gradient(120deg,#410c16 0%,#6e1b28 55%,#952f40 100%);
  --grad-btn:linear-gradient(135deg,#6b1a26 0%,#a03a4b 100%);
  --panel:linear-gradient(180deg,#ffffff 0%,#fdf6f7 55%,#f9eced 100%);
  --gold:#9a6c14; --gold-soft:#f5ead2;
  --good:#1d7a4b; --good-soft:#ddf1e5; --warn:#a8620a; --warn-soft:#fbeed8;
  --bad:#b0322c; --bad-soft:#f8e2e0; --info:#2b5c86; --info-soft:#e1ebf5;
  --shadow:0 1px 2px rgba(42,18,21,.06),0 6px 20px rgba(42,18,21,.07);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#150b0d; --surface:#211316; --raise:#2a191d; --ink:#f2e7e8; --muted:#b59c9f; --line:#3b2629;
  --accent:#d97a88; --accent-ink:#1a0a0d; --accent-soft:#3f1d23;
  --head:#3e1118; --head-ink:#ffffff; --head-muted:#d6a9b0;
  --grad-page:linear-gradient(160deg,#16050a 0%,#2b0b12 45%,#45131e 100%);
  --grad-head:linear-gradient(120deg,#25070d 0%,#43111c 60%,#5e1a28 100%);
  --grad-btn:linear-gradient(135deg,#8e2a3a 0%,#c0566a 100%);
  --panel:linear-gradient(180deg,#221317 0%,#1d0f13 100%);
  --gold:#e0b45a; --gold-soft:#3a2f17;
  --good:#5cc78f; --good-soft:#173a28; --warn:#e8a54a; --warn-soft:#3b2b14;
  --bad:#ef7a72; --bad-soft:#3d1d1b; --info:#7fb2e0; --info-soft:#18293a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:var(--grad-page);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--head);background-image:var(--grad-head);color:var(--head-ink);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;text-wrap:balance}
.brand small{display:block;color:var(--head-muted);font-size:.8rem;font-family:var(--f-body);font-weight:400}
.me{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--head-muted);flex-wrap:wrap}
.me b{color:var(--head-ink);font-weight:600}
.me .btn.link{color:var(--head-ink);text-decoration:underline;text-underline-offset:3px}
header.top .me .chip{background:rgba(255,255,255,.16);color:var(--head-ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px 2px;padding-bottom:10px}
nav.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:999px;color:var(--head-muted);font-weight:600;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{color:var(--head-ink)}
nav.tabs button[aria-selected="true"]{background:var(--head-ink);color:var(--head)}
header.top :focus-visible{outline-color:var(--head-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;margin-top:16px;padding:18px;background:var(--surface);background-image:var(--panel);border-radius:18px;box-shadow:0 12px 40px rgba(20,4,8,.35)}
@media (max-width:620px){main{padding:12px;border-radius:14px}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.datepick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);background-image:var(--grad-btn);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:8px}
.btn.link{border:0;background:transparent;padding:2px 6px;color:var(--accent)}
.icon{width:36px;height:36px;padding:0;justify-content:center}
input[type=date],input[type=month],input[type=text],input[type=password],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.sum span{font-size:.78rem;color:var(--muted)}
.sum .g b{color:var(--good)} .sum .w b{color:var(--warn)} .sum .r b{color:var(--bad)} .sum .i b{color:var(--info)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.who{min-width:0}
.who b{font-weight:600;display:block;overflow-wrap:anywhere}
.who span{color:var(--muted);font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.muted{background:var(--raise);color:var(--muted)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].good{background:var(--good);border-color:var(--good);color:var(--surface)}
.seg button[aria-pressed="true"].warn{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"].bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seg button[aria-pressed="true"].info{background:var(--info);border-color:var(--info);color:var(--surface)}
.seg button[disabled]{cursor:not-allowed;opacity:.6}
.rank{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font-family:var(--f-display);font-size:1.2rem;color:var(--muted);text-align:center}
.rank:nth-child(1) .n{color:var(--gold)}
.meter{height:6px;background:var(--raise);border-radius:4px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:4px}
.bal{text-align:left}
.bal b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;color:var(--gold);line-height:1}
.bal.neg b{color:var(--bad)}
.bal span{display:block;font-size:.75rem;color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.log{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.pts.p{color:var(--good)} .pts.m{color:var(--bad)} .pts.z{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.card{background:var(--surface);border-top:3px solid var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2,.sec h2{font-family:var(--f-display);font-weight:500;font-size:1.1rem;margin:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:.95rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.ro-note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em;margin:0}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{width:min(400px,100%);box-shadow:0 16px 50px rgba(20,4,8,.45);background-image:var(--panel);border-top:4px solid var(--accent)}
.gate h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);max-height:90%;overflow:auto}
.modal h3{font-family:var(--f-display);font-weight:500;margin:0;font-size:1.15rem}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle button{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--raise);font-weight:600;cursor:pointer}
.toggle button[aria-pressed="true"][data-v="reward"]{background:var(--good);color:var(--surface);border-color:var(--good)}
.toggle button[aria-pressed="true"][data-v="penalty"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;z-index:30;font-weight:500}
.reg-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table.reg{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:100%}
table.reg th,table.reg td{border:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
table.reg thead th{background:var(--accent-soft);font-weight:600;color:var(--muted);font-size:.72rem;line-height:1.3}
table.reg thead th b{display:block;font-size:.85rem;color:var(--ink)}
table.reg .nm{position:sticky;right:0;background:var(--surface);text-align:right;font-weight:600;color:var(--ink);z-index:1;min-width:9rem}
table.reg thead .nm{background:var(--accent-soft)}
table.reg td.off,table.reg th.off{background:var(--raise);color:var(--muted)}
table.reg th.td{outline:2px solid var(--accent);outline-offset:-2px}
table.reg .c-present{color:var(--good);font-weight:700} table.reg .c-late{color:var(--warn);font-weight:700}
table.reg .c-absent{color:var(--bad);font-weight:700;background:var(--bad-soft)} table.reg .c-leave{color:var(--info);font-weight:700}
table.reg .c-none{color:var(--line)}
table.reg .tot{font-weight:700;background:var(--raise)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend b{font-weight:700}
.banner{background:var(--accent-soft);background-image:linear-gradient(90deg,var(--accent-soft),var(--surface));color:var(--accent);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.banner.off{background:var(--raise);color:var(--muted);border:1px dashed var(--line)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);background-image:var(--grad-btn);border-color:var(--accent);color:var(--accent-ink)}
.tm{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.hol{display:flex;gap:6px;flex-wrap:wrap}
.notice{border-top:4px solid var(--accent)}
.notice-txt{white-space:pre-wrap;font-size:1.05rem;line-height:2;color:var(--ink)}
.brand h1{display:flex;align-items:center;gap:10px}
.hlogo{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25);flex:none}
.logo{width:96px;height:96px;border-radius:50%;align-self:center;box-shadow:0 6px 20px rgba(60,10,20,.35)}
.gate .card{align-items:stretch;text-align:right}
.gate .card h1{text-align:center}
.kio{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;color:#fff;text-align:center}
.kio-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.kio-head .logo{width:80px;height:80px}
.kio h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,4vw,2.2rem);margin:0}
.kio p{margin:0;color:#f3d9dd}
.kio-qr{background:#fff;border-radius:22px;padding:18px;width:min(78vw,62vh,440px);aspect-ratio:1;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.kio-qr svg{width:100%;height:100%;display:block}
.kio-bar{width:min(78vw,440px);height:6px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.kio-bar i{display:block;height:100%;width:100%;background:#e0b45a;transition:width 1s linear}
.kio-step{font-size:1.05rem;max-width:34rem}
.kio-clock{font-size:2rem;font-variant-numeric:tabular-nums;font-weight:600;color:#fff!important}
.kio .btn.link{color:#f3d9dd}
.kio .err{color:#ffd0d6}
.punch{align-items:stretch}
.punch-st{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.punch-st.in{background:var(--good-soft);border-color:var(--good)}
.punch-st b{font-size:1.25rem}
.punch-st span{color:var(--muted);font-size:.85rem}
.btn.big{padding:16px;font-size:1.15rem;justify-content:center}
.ok-note{background:var(--good-soft);color:var(--good);padding:12px;border-radius:10px;font-weight:700;margin:0;text-align:center}
.pch{display:inline-flex;gap:4px;align-items:center}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
.lnk:hover,.lnk:focus-visible{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
table.reg .c-excused{color:var(--muted);font-weight:700}
.prof{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.prof h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0}
.prof .bal b{font-size:2.4rem}
.tbl-wrap{overflow-x:auto}
table.calc{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
table.calc th,table.calc td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.calc th{color:var(--muted);font-weight:600;font-size:.8rem}
table.calc td.n{text-align:left}
table.calc tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink);font-size:1rem}
table.calc td.wrap{white-space:normal;min-width:12rem}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.req:first-child{border-top:0}
textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;resize:vertical}
@media (max-width:620px){.req{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){
  .sum{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr)}
  .log{grid-template-columns:minmax(0,1fr) auto}
  .log time{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const mins=hm=>{const [h,m]=(hm||'0:0').split(':').map(Number);return h*60+m};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function t12(hm){if(!hm)return '';let [h,m]=hm.split(':').map(Number);const p=h>=12?'م':'ص';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+p}
const hours=()=>t12(S.sched.start)+' – '+t12(S.sched.end);
const isAdmin=()=>S.me&&S.me.role==='admin';
const canRecord=()=>S.me&&(S.me.role==='admin'||S.me.role==='recorder');
const stamp=()=>({at:new Date().toISOString(),by:S.me?S.me.id:'',byName:S.me?S.me.name:''});

let toastT;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function fail(e){console.error(e);toast(e&&e.code==='permission-denied'?'قاعدة البيانات رفضت الحفظ. راجع قواعد Firestore لمجموعات dawam_':'تعذّر الحفظ، تحقق من الاتصال بالإنترنت');}

async function setAtt(emp,kind){
  if(!canRecord()||!isWork(S.date))return;
  const id='att_'+S.date+'_'+emp;const cur=attFor(emp,S.date);
  try{
    if(cur&&cur.kind===kind){await col('logs').doc(id).delete();return}
    let k=kind,time='';
    if(isAdmin()){await col('logs').doc(id).set({emp,kind:k,pts:Number(S.rules[k])||0,date:S.date,time:'',manual:true,note:'',...stamp()});return}
    if((k==='present'||k==='late')&&S.date===today()){
      time=nowHM();
      if(k==='present'&&mins(time)>mins(S.sched.start)+(Number(S.sched.grace)||0)){k='late';toast('سُجّل متأخراً: الحضور '+t12(time)+' بعد بداية الدوام '+t12(S.sched.start))}
    }
    await col('logs').doc(id).set({emp,kind:k,pts:Number(S.rules[k])||0,date:S.date,time,note:'',...stamp()});
  }catch(e){fail(e)}
}
async function markAllPresent(){
  if(!isWork(S.date))return;
  const todo=activeEmps().filter(e=>!attFor(e.id,S.date));
  const batch=db.batch();const time=S.date===today()&&!isAdmin()?nowHM():'';
  todo.forEach(e=>batch.set(col('logs').doc('att_'+S.date+'_'+e.id),{emp:e.id,kind:'present',pts:Number(S.rules.present)||0,date:S.date,time,note:'',...stamp()}));
  try{await batch.commit();toast('سُجّل حضور '+num(todo.length)+' موظف')}catch(e){fail(e)}
}
async function saveSched(patch){
  try{await col('config').doc('schedule').set({...S.sched,...patch})}catch(e){fail(e);return false}
  return true;
}
async function toggleDate(ds){
  const sc=S.sched;let holidays=[...(sc.holidays||[])],extra=[...(sc.extra||[])];
  if(isWork(ds)){if(extra.includes(ds))extra=extra.filter(x=>x!==ds);else holidays.push(ds)}
  else{if(holidays.includes(ds))holidays=holidays.filter(x=>x!==ds);else extra.push(ds)}
  if(await saveSched({holidays:holidays.sort(),extra:extra.sort()}))toast(isWorkAfter(ds,holidays,extra)?'أصبح '+fmtDate(ds)+' يوم دوام':'أصبح '+fmtDate(ds)+' يوم عطلة');
}
function isWorkAfter(ds,h,x){if(x.includes(ds))return true;if(h.includes(ds))return false;return !!(S.sched.days||DEF_SCHED.days)[wday(ds)]}
function monthDays(ym){const [y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>ym+'-'+String(i+1).padStart(2,'0'))}
const offices=()=>[...new Set(S.emps.map(e=>(e.office||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
const sumPts=a=>a.reduce((s,l)=>s+(Number(l.pts)||0),0);
function regData(ym){
  const days=monthDays(ym);const t=today();const q=(S.regQ||'').trim();
  let emps=S.emps.filter(e=>!e.archived||S.logs.some(l=>l.emp===e.id&&(l.date||'').startsWith(ym)));
  if(S.regOffice)emps=emps.filter(e=>(e.office||'').trim()===S.regOffice);
  if(q)emps=emps.filter(e=>(e.name+' '+(e.title||'')+' '+(e.office||'')).includes(q));
  emps.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  let rows=emps.map(e=>{
    const c={present:0,late:0,absent:0,excused:0,leave:0};let due=0;
    const cells=days.map(ds=>{const a=attFor(e.id,ds);const w=isWork(ds);if(a&&c[a.kind]!=null)c[a.kind]++;if(w&&ds<=t)due++;return {ds,w,a}});
    const rec=c.present+c.late+c.absent+c.excused+c.leave;const base=due-c.leave-c.excused;
    const ml=S.logs.filter(l=>l.emp===e.id&&(l.date||'').startsWith(ym));const rw=ml.filter(l=>l.kind==='reward'),pn=ml.filter(l=>l.kind==='penalty');
    return {e,cells,c,due,missing:Math.max(0,due-rec),rate:base>0?Math.round((c.present+c.late)/base*100):null,mpts:sumPts(ml),bal:balance(e.id),rw:rw.length,rwp:sumPts(rw),pn:pn.length,pnp:sumPts(pn),svp:-sumPts(ml.filter(l=>l.kind==='service')),logs:ml};
  });
  const f=S.regFilter;
  if(f)rows=rows.filter(r=>f==='absent'?r.c.absent>0:f==='late'?r.c.late>0:f==='missing'?r.missing>0:f==='penalty'?r.pn>0:f==='clean'?(r.due>0&&!r.missing&&!r.c.absent&&!r.c.late):true);
  return {days,emps:rows};
}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)});
}
async function exportXLSX(){

  const sheet=(rows,widths)=>{const ws=X.utils.aoa_to_sheet(rows);ws['!autofilter']={ref:ws['!ref']};ws['!cols']=widths.map(w=>({wch:w}));return ws};
  const sum=[['ت','الموظف','العنوان الوظيفي','المكتب','الحالة','أيام الدوام المنقضية','حضور','تأخر','غياب بلا عذر','غياب بعذر','إجازة','غير مسجل','نسبة الحضور %','عدد المكافآت','نقاط المكافآت','عدد العقوبات','نقاط العقوبات','نقاط مصروفة على الخدمات','نقاط الشهر','الرصيد الكلي'],
    ...emps.map((r,i)=>[i+1,r.e.name,r.e.title||'',r.e.office||'',r.e.archived?'مؤرشف':'في الخدمة',r.due,r.c.present,r.c.late,r.c.absent,r.c.excused,r.c.leave,r.missing,r.rate??'',r.rw,r.rwp,r.pn,r.pnp,r.svp,r.mpts,r.bal])];
  const grid=[['الموظف','المكتب',...days.map(d=>Number(d.slice(8))+' '+WDS[wday(d)])],
    ...emps.map(r=>[r.e.name,r.e.office||'',...r.cells.map(x=>x.a?(KIND[x.a.kind]?.l||'')+(x.a.time?' '+t12(x.a.time):''):(x.w?(x.ds<=today()?'غير مسجل':''):'عطلة'))])];
  const det=[['التاريخ','اليوم','الموظف','العنوان الوظيفي','المكتب','النوع','وقت الحضور','النقاط','السبب','سجّله'],
    ...emps.flatMap(r=>r.logs.map(l=>[l.date,WD[wday(l.date)],r.e.name,r.e.title||'',r.e.office||'',KIND[l.kind]?.l||l.kind,l.time?t12(l.time):'',Number(l.pts)||0,l.note||'',l.byName||''])).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||String(a[2]).localeCompare(String(b[2]),'ar'))];
  const wb=X.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  X.utils.book_append_sheet(wb,sheet(sum,[5,24,18,16,10,12,7,7,11,10,7,9,12,10,11,10,11,14,10,11]),'ملخص الشهر');
  X.utils.book_append_sheet(wb,sheet(grid,[24,16,...days.map(()=>11)]),'الحضور اليومي');
  X.utils.book_append_sheet(wb,sheet(det,[11,10,24,18,16,10,11,8,34,16]),'تفاصيل القيود');
  X.writeFile(wb,'سجل-الدوام-'+S.regMonth+'.xlsx');

function modal(html,onMount){
  const L=document.getElementById('layer');
  L.innerHTML='<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  const ov=document.getElementById('ov');
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.addEventListener('keydown',escClose);
  onMount&&onMount(ov.firstChild);
  const f=ov.querySelector('input:not([disabled]),select');f&&f.focus();
}
function escClose(e){if(e.key==='Escape')close()}
function close(){document.getElementById('layer').innerHTML='';document.removeEventListener('keydown',escClose)}
function confirmBox(title,text,okLabel,fn){

      if(role==='employee'&&S.users.some(x=>x.empId===empId&&x.id!==(u&&u.id))){er.textContent='هذا الموظف مرتبط بحساب آخر';return}
      if(u){
        if(u.role==='admin'&&role!=='admin'&&S.users.filter(x=>x.role==='admin').length<2){er.textContent='يجب أن يبقى مدير نظام واحد على الأقل';return}
        close();try{await col('users').doc(u.id).update({name,role,empId});toast('حُفظ المستخدم')}catch(e){fail(e)}return;
      }
      const username=m.querySelector('#uu').value.trim().toLowerCase(),pass=m.querySelector('#up').value;
      if(!/^[a-z0-9._-]{3,}$/.test(username)){er.textContent='اسم الدخول: 3 أحرف إنجليزية أو أرقام على الأقل';return}
      if(pass.length<6){er.textContent='كلمة المرور 6 أحرف على الأقل';return}
      if((await col('usernames').doc(username).get()).exists){er.textContent='اسم الدخول مستخدم مسبقاً';return}
      er.textContent='جارٍ إنشاء الحساب…';
      try{
        const email=username+MAILDOM;const uid=await createAuthUser(email,pass);
        const bt=db.batch();bt.set(col('users').doc(uid),{name,username,role,empId,device:'',auth:true,createdAt:new Date().toISOString()});bt.set(col('usernames').doc(username),{email,uid});await bt.commit();
        close();toast('أُنشئ حساب '+name+' · اسم الدخول: '+username);
      }catch(e){er.textContent=authErr(e)}
    };
  });
}

      er.textContent='جارٍ التغيير…';

function gate(html){const g=document.getElementById('gate');g.hidden=false;document.getElementById('shell').hidden=true;document.getElementById('kiosk').hidden=true;g.innerHTML=html}
function gateMsg(t,b){gate(`<div class="card">${LOGO}<h1>دفتر الدوام والنقاط</h1><p class="hint">${t}</p>${b||''}</div>`)}
function gateSetup(){
  gate(`<form class="card" id="sf">${LOGO}<h1>دفتر الدوام والنقاط</h1><p class="hint">أول تشغيل: أنشئ حساب مدير النظام. بعدها تضيف حسابات الموظفين والمسجّلين من داخل التطبيق.</p>
    <label class="f">الاسم الظاهر<input id="sn" type="text" required></label>
    <label class="f">اسم الدخول<input id="su" type="text" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input id="sp" type="password" autocomplete="new-password" required></label>
    <p class="err" id="se"></p><button class="btn primary" type="submit">إنشاء الحساب والدخول</button></form>`);
  document.getElementById('sf').onsubmit=async e=>{
    e.preventDefault();const er=document.getElementById('se');
    const name=document.getElementById('sn').value.trim(),username=document.getElementById('su').value.trim().toLowerCase(),pass=document.getElementById('sp').value;
    if(!name){er.textContent='اكتب اسمك';return}
    if(!/^[a-z0-9._-]{3,}$/.test(username)){er.textContent='اسم الدخول: 3 أحرف إنجليزية أو أرقام على الأقل';return}
    if(pass.length<6){er.textContent='كلمة المرور 6 أحرف على الأقل';return}
    er.textContent='جارٍ الإنشاء…';S.booting=true;
    try{
      const email=username+MAILDOM;const cred=await firebase.auth().createUserWithEmailAndPassword(email,pass);const uid=cred.user.uid;
      const bt=db.batch();
      bt.set(col('users').doc(uid),{name,username,role:'admin',empId:'',device:'',auth:true,createdAt:new Date().toISOString()});
      bt.set(col('usernames').doc(username),{email,uid});
      bt.set(col('config').doc('bootstrap'),{by:uid,at:firebase.firestore.FieldValue.serverTimestamp()});
      await bt.commit();
      try{const old=await col('users').get();const b2=db.batch();let n=0;old.docs.forEach(d=>{if(!d.data().auth){b2.delete(d.ref);n++}});if(n)await b2.commit()}catch(_){}
      S.booting=false;onUser(firebase.auth().currentUser);

function subPunches(){

async function onUser(user){
  unsubAll();S.me=null;

    try{const any=await col('usernames').limit(1).get();if(any.empty){gateSetup();return}}catch(e){}

  if(!snap.exists){gateMsg('هذا الحساب غير مفعّل أو حُذف. راجع مدير النظام.','<button class="btn" data-act="logout" onclick="firebase.auth().signOut()">خروج</button>');return}
  S.me={id:user.uid,...snap.data()};
  unsubs.push(col('users').doc(user.uid).onSnapshot(s=>{if(!s.exists){logout();return}S.me={id:user.uid,...s.data()};render()}));
  const r=S.me.role;

    if(!S.me.device){try{await col('users').doc(user.uid).update({device:devId()});S.me.device=devId()}catch(_){}}
    const e=S.me.empId;S.tab=S.k?'me':(['me','mypage'].includes(S.tab)?S.tab:'me');
    unsubs.push(col('employees').doc(e).onSnapshot(s=>{S.emps=s.exists?[{id:s.id,...s.data()}]:[];S.loaded.emps=true;render()},onErr));
    snapList(col('logs').where('emp','==',e),'logs','logs');
    snapList(col('requests').where('emp','==',e),'reqs');
    snapList(col('punch').where('emp','==',e),'myPunches');
  }else{
    snapList(col('employees'),'emps','emps');snapList(col('logs'),'logs','logs');snapList(col('requests'),'reqs');
    if(r==='admin')snapList(col('users'),'users');

  }
  render();
}

/* ===== شاشة المكتب (رمز QR متغيّر) ===== */
const ROTATE=30;let kioskT=null,kioskTick=null,kioskCode='',kioskLeft=ROTATE,wakeLock=null;
function loadQR(){if(window.qrcode)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const newCode=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('')};
const punchURL=c=>location.origin+location.pathname+'?k='+c;
async function rotateKiosk(){
  const prev=kioskCode;const code=newCode();
  try{await col('kiosk').doc('current').set({code,prev:prev||'',at:firebase.firestore.FieldValue.serverTimestamp()});kioskCode=code;kioskLeft=ROTATE;drawKiosk('')}
  catch(e){drawKiosk('تعذّر تحديث الرمز، تحقق من اتصال الشاشة بالإنترنت')}
}
function drawKiosk(err){
  const box=document.getElementById('kqr');if(!box)return;
  if(kioskCode&&window.qrcode){const q=qrcode(0,'M');q.addData(punchURL(kioskCode));q.make();box.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true})}
  document.getElementById('kerr').textContent=err||'';
}
async function startKiosk(){
  gateHide();const k=document.getElementById('kiosk');k.hidden=false;document.getElementById('shell').hidden=true;
  k.innerHTML=`<div class="kio"><div class="kio-head">${LOGO}<div><h1>تسجيل الحضور والانصراف</h1><p id="kdate"></p></div></div>
    <div class="kio-qr" id="kqr" aria-label="رمز الحضور"></div>
    <div class="kio-bar"><i id="kbar"></i></div>
    <p class="kio-step">افتح كاميرا موبايلك ووجّهها على الرمز، ثم اضغط «سجّل» في الصفحة التي تفتح.</p>
    <p class="kio-clock" id="kclock"></p><p class="err" id="kerr"></p>
    <button class="btn link" onclick="firebase.auth().signOut()">خروج من وضع الشاشة</button></div>`;
  try{await loadQR()}catch(e){document.getElementById('kerr').textContent='تعذّر تحميل مولّد الرمز، تحقق من الإنترنت';}
  try{const c=await col('kiosk').doc('current').get();if(c.exists)kioskCode=c.data().code||''}catch(_){}
  await rotateKiosk();
  kioskT=setInterval(()=>{if(!document.hidden)rotateKiosk()},ROTATE*1000);
  kioskTick=setInterval(()=>{kioskLeft=Math.max(0,kioskLeft-1);const b=document.getElementById('kbar');if(b)b.style.width=(kioskLeft/ROTATE*100)+'%';
    const n=new Date();const c=document.getElementById('kclock');if(c)c.textContent=n.toLocaleTimeString('ar-IQ',{hour:'numeric',minute:'2-digit',second:'2-digit'});
    const d=document.getElementById('kdate');if(d)d.textContent=fmtDate(today())+' · الدوام '+hours()},1000);
  unsubs.push(col('config').doc('schedule').onSnapshot(s=>{S.sched=s.exists?{...DEF_SCHED,...s.data()}:{...DEF_SCHED}},()=>{}));
  try{wakeLock=await navigator.wakeLock.request('screen')}catch(_){}
}
function stopKiosk(){clearInterval(kioskT);clearInterval(kioskTick);kioskT=kioskTick=null;kioskCode='';try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null}
function gateHide(){document.getElementById('gate').hidden=true}

/* ===== البصمة (دخول وخروج) ===== */
const tsDate=p=>p&&p.ts&&p.ts.toDate?p.ts.toDate():null;
const hmOf=d=>d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'';
const dayOf=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';
function distM(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const x=r(c-a),y=r(d-b);const h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
function getPos(){return new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>ok(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0})})}
function punchSummary(list){
  const ps=list.filter(p=>tsDate(p)).sort((a,b)=>tsDate(a)-tsDate(b));
  const ins=ps.filter(p=>p.type==='in'),outs=ps.filter(p=>p.type==='out');
  return {ps,inP:ins[0]||null,outP:outs[outs.length-1]||null,last:ps[ps.length-1]||null};
}
function punchFlags(sum,ds){
  const f=[];const sc=S.sched;const geo=sc.geo||{};
  if(sum.inP&&mins(hmOf(tsDate(sum.inP)))>mins(sc.start)+(Number(sc.grace)||0))f.push(['warn','دخل متأخراً']);
  if(sum.outP&&mins(hmOf(tsDate(sum.outP)))<mins(sc.end)-10)f.push(['warn','خرج قبل نهاية الدوام']);
  if(sum.inP&&(!sum.outP||tsDate(sum.outP)<tsDate(sum.inP))&&(ds<today()||mins(nowHM())>mins(sc.end)+30))f.push(['bad','بدون تسجيل خروج']);
  if(geo.on&&sum.ps.some(p=>p.dist!=null&&p.dist>(Number(geo.radius)||150)))f.push(['bad','بصمة من خارج موقع المكتب']);
  if(geo.on&&sum.ps.some(p=>p.lat==null))f.push(['muted','بدون موقع']);
  if(sum.ps.some(p=>dayOf(tsDate(p))!==p.day))f.push(['bad','تاريخ غير مطابق']);
  return f;
}
async function doPunch(){
  const btn=document.getElementById('pbtn');const msg=document.getElementById('pmsg');if(btn)btn.disabled=true;
  const sum=punchSummary((S.myPunches||[]).filter(p=>p.day===today()));const type=sum.last&&sum.last.type==='in'?'out':'in';
  if(msg)msg.textContent='جارٍ التسجيل…';
  const geo=S.sched.geo||{};let pos=null;if(geo.on){if(msg)msg.textContent='جارٍ تحديد موقعك…';pos=await getPos()}
  const rec={emp:S.me.empId,uid:S.me.id,type,code:S.k,day:today(),device:devId(),ts:firebase.firestore.FieldValue.serverTimestamp(),lat:pos?pos.latitude:null,lng:pos?pos.longitude:null,acc:pos?Math.round(pos.accuracy):null,dist:pos&&geo.lat!=null?distM(pos.latitude,pos.longitude,geo.lat,geo.lng):null,ua:navigator.userAgent.slice(0,140)};
  try{await col('punch').add(rec);S.k='';history.replaceState(null,'',location.pathname);S.punchOk=type;render();toast(type==='in'?'سُجّل دخولك':'سُجّل خروجك')}
  catch(e){console.error(e);if(msg)msg.textContent=e.code==='permission-denied'?(S.me.device&&S.me.device!==devId()?'هذا الحساب مربوط بجهاز آخر. اطلب من مدير النظام إعادة ضبط الجهاز.':'الرمز منتهي أو غير صالح. امسح الرمز من شاشة المكتب مرة ثانية.'):'تعذّر التسجيل، تحقق من الإنترنت';if(btn)btn.disabled=false;
    if(e.code==='permission-denied'){S.k='';history.replaceState(null,'',location.pathname)}}
}

  h+='</div>';
  const ym=today().slice(0,7);const days=[...new Set(mine.map(p=>p.day).filter(d=>d&&d.startsWith(ym)))].sort().reverse();

  return h;

async function approvePunches(){
  const sc=S.sched;const bt=db.batch();let n=0;

    const t=hmOf(tsDate(s.inP));const k=mins(t)>mins(sc.start)+(Number(sc.grace)||0)?'late':'present';
    bt.set(col('logs').doc('att_'+S.date+'_'+e.id),{emp:e.id,kind:k,pts:Number(S.rules[k])||0,date:S.date,time:t,out:s.outP?hmOf(tsDate(s.outP)):'',note:'حسب البصمة',...stamp()});n++});

/* ===== العرض ===== */
function roNote(){return canRecord()?'':'<div class="ro-note">حسابك للاطلاع فقط. التسجيل يحتاج صلاحية «مسجّل دوام» من مدير النظام.</div>'}

  const ls=S.logs.filter(l=>l.emp===e.id).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.at||'').localeCompare(b.at||''));
  const g=k=>ls.filter(l=>l.kind===k);const bal=sumPts(ls);
  const earned=ls.filter(l=>Number(l.pts)>0).reduce((s,l)=>s+Number(l.pts),0);
  const spent=-sumPts(g('service'));const deducted=-ls.filter(l=>Number(l.pts)<0&&l.kind!=='service').reduce((s,l)=>s+Number(l.pts),0);
  const cats=[['present','أيام الحضور'],['late','أيام التأخر'],['absent','غياب بلا عذر رسمي'],['excused','غياب بعذر رسمي'],['leave','إجازات'],['reward','مكافآت مهام إضافية'],['penalty','عقوبات'],['service','خدمات مصروفة']];
  const reqs=S.reqs.filter(q=>q.emp===e.id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const ym=today().slice(0,7);const mr=regData(ym).emps.find(r=>r.e.id===e.id);
  let h=`<div class="bar">${S.me.role==='employee'?'<span></span>':'<button class="btn sm" data-act="back">→ رجوع</button>'}<div class="seg">${canRecord()&&!e.archived?`<button class="btn sm" data-act="points" data-emp="${esc(e.id)}">مكافأة أو عقوبة</button><button class="btn sm primary" data-act="newreq" data-emp="${esc(e.id)}">طلب خدمة</button>`:''}${isAdmin()?`<button class="btn sm" data-act="editemp" data-id="${esc(e.id)}">تعديل البيانات</button>`:''}</div></div>`;
  h+=`<div class="card prof"><div class="who"><h2>${esc(e.name)} ${e.archived?'<span class="chip muted">مؤرشف</span>':'<span class="chip good">في الخدمة</span>'}</h2>
    <span>${esc([e.title,e.office].filter(Boolean).join(' · ')||'لا يوجد عنوان وظيفي')}${e.createdAt?' · أُضيف '+esc(shortDate(e.createdAt.slice(0,10))):''}</span></div>
    <div class="bal ${bal<0?'neg':''}"><b>${num(bal)}</b><span>رصيد النقاط الحالي</span></div></div>`;
  h+=`<div class="sum"><div class="g"><b>+${num(earned)}</b><span>نقاط مكتسبة</span></div><div class="r"><b>−${num(deducted)}</b><span>نقاط مخصومة</span></div><div class="i"><b>−${num(spent)}</b><span>مصروفة على الخدمات</span></div><div><b>${num(reqs.filter(q=>q.status==='pending').length)}</b><span>طلبات قيد الانتظار</span></div><div class="w"><b>${mr&&mr.rate!=null?num(mr.rate)+'٪':'—'}</b><span>نسبة حضور الشهر</span></div></div>`;
  h+=`<div class="card"><h2>احتساب الرصيد</h2><div class="tbl-wrap"><table class="calc"><thead><tr><th>البند</th><th>العدد</th><th>النقاط</th></tr></thead><tbody>`
    +cats.map(([k,l])=>{const a=g(k);return `<tr><td>${l}</td><td>${num(a.length)}</td><td class="n"><span class="pts ${ptsCls(sumPts(a))}">${signed(sumPts(a))}</span></td></tr>`}).join('')
    +`</tbody><tfoot><tr><td>الرصيد الحالي</td><td></td><td class="n"><span class="pts ${ptsCls(bal)}">${signed(bal)}</span></td></tr></tfoot></table></div></div>`;
  h+=`<div class="card"><div class="bar"><h2>الطلبات والخدمات</h2>${canRecord()&&!e.archived?`<button class="btn sm primary" data-act="newreq" data-emp="${esc(e.id)}">طلب خدمة</button>`:''}</div>`
    +(reqs.length?'<div class="list">'+reqs.map(q=>reqRow(q,false)).join('')+'</div>':'<p class="hint">لم يطلب هذا الموظف أي خدمة بعد.</p>')+'</div>';
  let run=0;const st=ls.map(l=>{run+=Number(l.pts)||0;return {l,run}}).reverse();
  h+=`<div class="card"><h2>كشف النقاط</h2>`+(st.length?`<div class="tbl-wrap"><table class="calc"><thead><tr><th>التاريخ</th><th>البيان</th><th>النقاط</th><th>الرصيد بعدها</th></tr></thead><tbody>`
    +st.map(({l,run})=>`<tr><td>${esc(shortDate(l.date))}</td><td class="wrap">${esc(KIND[l.kind]?.l||l.kind)}${l.time?' · '+esc(t12(l.time)):''}${l.note?' · '+esc(l.note):''}</td><td class="n"><span class="pts ${ptsCls(l.pts)}">${signed(Number(l.pts)||0)}</span></td><td class="n">${num(run)}</td></tr>`).join('')
    +'</tbody></table></div>':'<p class="hint">لا توجد قيود بعد.</p>')+'</div>';
  return h;
}
function render(){
  if(!S.me||S.me.role==='kiosk')return;
  const emp=S.me.role==='employee';
  const tabs=emp?[['me','حضوري'],['mypage','صفحتي'],['rules','لائحة النقاط']]:TABS.filter(t=>!t[2]||(t[2]==='rec'?canRecord():isAdmin()));
  if(S.tab!=='emp'&&!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join('');
  const r=ROLES[S.me.role]||ROLES.viewer;
  document.getElementById('me').innerHTML=`<b>${esc(S.me.name)}</b><span class="chip ${r.c}">${r.l}</span><button class="btn link" data-act="mypass">كلمة المرور</button><button class="btn link" data-act="logout">خروج</button>`;
  const app=document.getElementById('app');
  if(!(S.loaded.emps&&S.loaded.logs)){app.innerHTML='<div class="list"><div class="empty"><b>جارٍ تحميل الدفتر…</b>يُجلب الموظفون والسجلات.</div></div>';return}
  if(!emp&&S.punchDay!==S.date)subPunches();
  if(emp&&S.tab==='mypage')S.empId=S.me.empId;
  app.innerHTML=({me:viewMe,mypage:viewEmp,day:viewDay,register:viewRegister,points:viewPoints,requests:viewReqs,emp:viewEmp,log:viewLog,sched:viewSched,staff:viewStaff,users:viewUsers,rules:viewRules})[S.tab]();
}

/* ===== أحداث ===== */
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;try{localStorage.setItem('dawam_tab',S.tab)}catch(_){}render()});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='dpick'&&e.target.value){S.date=e.target.value;render()}
  if(e.target.id==='lemp'){S.logEmp=e.target.value;render()}
  if(e.target.id==='lmon'){S.logMonth=e.target.value;render()}
  if(e.target.id==='rmon'&&e.target.value){S.regMonth=e.target.value;render()}
  if(e.target.id==='roff'){S.regOffice=e.target.value;render()}
  if(e.target.id==='rflt'){S.regFilter=e.target.value;render()}
  if(e.target.id==='rq'){S.regQ=e.target.value;render()}
  if(e.target.id==='qflt'){S.reqFilter=e.target.value;render()}
});
document.getElementById('shell').addEventListener('click',e=>{
  const at=e.target.closest('[data-att]');if(at){setAtt(at.dataset.emp,at.dataset.att);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;const emp=S.emps.find(x=>x.id===id);const usr=S.users.find(x=>x.id===id);
  switch(b.dataset.act){
    case 'prev':S.date=shift(S.date,-1);render();break;
    case 'fsignout':firebase.auth().signOut();break;
    case 'next':S.date=shift(S.date,1);render();break;
    case 'today':S.date=today();render();break;
    case 'allpresent':markAllPresent();break;
    case 'toggleday':toggleDate(S.date);break;
    case 'csv':exportXLSX();break;
    case 'rclear':S.regOffice='';S.regFilter='';S.regQ='';render();break;
    case 'wdtoggle':b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');break;
    case 'savesched':{const days=[...document.querySelectorAll('#wdays button')].map(x=>x.getAttribute('aria-pressed')==='true');
      const start=document.getElementById('s_start').value,end=document.getElementById('s_end').value,grace=Math.max(0,parseInt(document.getElementById('s_grace').value,10)||0);
      if(!days.some(Boolean)){toast('اختر يوم دوام واحداً على الأقل');break}
      if(!start||!end||mins(end)<=mins(start)){toast('وقت نهاية الدوام يجب أن يكون بعد وقت البداية');break}
      saveSched({days,start,end,grace}).then(ok=>ok&&toast('حُفظت أيام وأوقات الدوام'));break}
    case 'addhol':{const d=document.getElementById('h_date').value;if(!d){toast('اختر تاريخ العطلة');break}
      const holidays=[...new Set([...(S.sched.holidays||[]),d])].sort(),extra=(S.sched.extra||[]).filter(x=>x!==d);
      saveSched({holidays,extra}).then(ok=>ok&&toast('أُضيفت العطلة: '+fmtDate(d)));break}
    case 'delhol':{const d=b.dataset.d;saveSched({holidays:(S.sched.holidays||[]).filter(x=>x!==d)}).then(ok=>ok&&toast('حُذفت العطلة'));break}
    case 'points':pointsModal(b.dataset.emp);break;
    case 'openemp':if(S.tab!=='emp')S.prevTab=S.tab;S.empId=id;S.tab='emp';render();scrollTo(0,0);break;
    case 'back':S.tab=S.prevTab||'staff';render();break;
    case 'newreq':reqModal(b.dataset.emp||S.empId);break;
    case 'reqdone':{const q=S.reqs.find(x=>x.id===id);if(q)confirmBox('إنجاز الطلب؟',empName(q.emp)+' · '+q.title+' · ستُخصم '+num(Number(q.pts)||0)+' نقطة من رصيده','إنجاز وخصم',()=>reqDone(q));break}
    case 'reqreject':{const q=S.reqs.find(x=>x.id===id);if(q)confirmBox('رفض الطلب؟',empName(q.emp)+' · '+q.title,'رفض',async()=>{try{await col('requests').doc(id).update({status:'rejected'});toast('رُفض الطلب')}catch(err){fail(err)}});break}
    case 'reqreopen':{const q=S.reqs.find(x=>x.id===id);if(q)confirmBox(q.status==='done'?'إلغاء إنجاز الطلب؟':'إعادة فتح الطلب؟',q.status==='done'?'ستُعاد '+num(Number(q.pts)||0)+' نقطة إلى رصيد '+empName(q.emp):'سيرجع الطلب إلى قيد الانتظار','تأكيد',()=>reqReopen(q));break}
    case 'reqdel':{const q=S.reqs.find(x=>x.id===id);if(q)confirmBox('حذف الطلب؟',q.title+(q.status==='done'?' · ستُعاد نقاطه إلى الرصيد':''),'حذف',async()=>{try{const bt=db.batch();bt.delete(col('logs').doc('svc_'+id));bt.delete(col('requests').doc(id));await bt.commit();toast('حُذف الطلب')}catch(err){fail(err)}});break}
    case 'addemp':empModal(null);break;
    case 'editemp':empModal(emp);break;
    case 'archive':confirmBox('أرشفة '+emp.name+'؟','سيختفي من الدوام اليومي والترتيب، ويبقى سجله ونقاطه محفوظة.','أرشفة',async()=>{try{await col('employees').doc(id).update({archived:true});toast('أُرشف '+emp.name)}catch(err){fail(err)}});break;
    case 'restore':col('employees').doc(id).update({archived:false}).then(()=>toast('أُعيد '+emp.name+' للخدمة')).catch(fail);break;
    case 'delemp':{const ids=S.logs.filter(l=>l.emp===id).map(l=>l.id);const n=ids.length;
      confirmBox('حذف '+emp.name+' نهائياً؟',n?'سيُحذف الموظف مع '+num(n)+' قيد من سجل الحضور والنقاط، ولا يمكن التراجع. للاحتفاظ بسجله استخدم الأرشفة بدلاً من الحذف.':'سيُحذف الموظف نهائياً من الدفتر، ولا يمكن التراجع.','حذف نهائي',async()=>{
        try{for(let i=0;i<ids.length;i+=400){const bt=db.batch();ids.slice(i,i+400).forEach(x=>bt.delete(col('logs').doc(x)));await bt.commit()}
          const rq=S.reqs.filter(q=>q.emp===id);if(rq.length){const bt=db.batch();rq.forEach(q=>bt.delete(col('requests').doc(q.id)));await bt.commit()}
          await col('employees').doc(id).delete();toast('حُذف '+emp.name+(n?' مع '+num(n)+' قيد':''))}catch(err){fail(err)}});break}
    case 'dellog':{const l=S.logs.find(x=>x.id===id);confirmBox('حذف القيد؟',l?empName(l.emp)+' · '+(KIND[l.kind]?.l||'')+' · '+signed(Number(l.pts)||0)+' نقطة'+(l.reqId?' · سيرجع الطلب المرتبط إلى قيد الانتظار':''):'','حذف القيد',async()=>{try{if(l&&l.reqId&&S.reqs.some(q=>q.id===l.reqId))await reqReopen(S.reqs.find(q=>q.id===l.reqId));else await col('logs').doc(id).delete();toast('حُذف القيد')}catch(err){fail(err)}});break}
    case 'saverules':{const r={};[...ATT,'penalty','svc_personal','svc_appoint'].forEach(k=>{r[k]=parseInt(document.getElementById('r_'+k).value,10)||0});['penalty','svc_personal','svc_appoint'].forEach(k=>r[k]=Math.abs(r[k]));col('config').doc('rules').set(r).then(()=>toast('حُفظت لائحة النقاط')).catch(fail);break}
    case 'adduser':userModal(null);break;
    case 'edituser':userModal(usr);break;
    case 'deluser':if(usr.role==='admin'&&S.users.filter(x=>x.role==='admin'&&x.auth).length<2){toast('لا يمكن حذف آخر مدير نظام');break}
      confirmBox('حذف المستخدم '+usr.name+'؟','لن يستطيع الدخول بعد الآن. قيوده السابقة تبقى في السجل.','حذف',async()=>{try{const bt=db.batch();bt.delete(col('users').doc(id));if(usr.username)bt.delete(col('usernames').doc(usr.username));await bt.commit();toast('حُذف المستخدم')}catch(err){fail(err)}});break;
    case 'mypass':myPassModal();break;
    case 'logout':logout();break;
    case 'punch':doPunch();break;
    case 'approve':approvePunches();break;
    case 'resetpass':resetPassModal(usr);break;
    case 'resetdev':confirmBox('إعادة ضبط جهاز '+usr.name+'؟','سيرتبط الحساب بأول موبايل يدخل منه بعد الآن.','إعادة ضبط',async()=>{try{await col('users').doc(id).update({device:''});toast('أُعيد ضبط الجهاز')}catch(err){fail(err)}});break;
    case 'setgeo':toast('جارٍ تحديد الموقع…');getPos().then(p=>{if(!p){toast('تعذّر تحديد الموقع، اسمح للمتصفح بالوصول للموقع');return}saveSched({geo:{...(S.sched.geo||{}),lat:p.latitude,lng:p.longitude,on:true,radius:Number(document.getElementById('g_rad').value)||150}}).then(ok=>ok&&toast('حُفظ موقع المكتب · الدقة '+Math.round(p.accuracy)+' م'))});break;
    case 'savegeo':saveSched({geo:{...(S.sched.geo||{}),on:document.getElementById('g_on').checked,radius:Math.max(30,Number(document.getElementById('g_rad').value)||150)}}).then(ok=>ok&&toast('حُفظت الإعدادات'));break;
  }
});

/* ===== تشغيل ===== */
try{const t=localStorage.getItem('dawam_tab');if(t)S.tab=t}catch(_){}
try{
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
}catch(e){document.getElementById('gate').innerHTML='<div class="card"><h1>دفتر الدوام والنقاط</h1><p class="err">تعذّر تحميل Firebase. تحقق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p></div>';return}
firebase.auth().onAuthStateChanged(u=>onUser(u));
})();
</script>
